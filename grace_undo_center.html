<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindred Guild — Action History</title>
  <style>
    :root {
      --bg: #09090c;
      --surface: #12121a;
      --surface-2: #1e1e2c;
      --text: #e1e1e9;
      --text-dim: #8b8b9c;
      --accent: #c9a84c;
      --border: #222230;
      --error: #ef4444;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      padding: 40px 20px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: var(--accent); margin-bottom: 20px; font-family: 'Cinzel', 'Georgia', serif; }
    .action-item {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: opacity 0.2s;
    }
    .action-info { display: flex; flex-direction: column; gap: 5px; }
    .action-type { font-weight: bold; color: var(--accent); }
    .action-time { font-size: 0.85rem; color: var(--text-dim); }
    .undo-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .undo-btn:hover { background: var(--accent); color: #000; }
    .expired { opacity: 0.6; }
    .expired-label { font-size: 0.75rem; color: var(--error); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1>Action History & Reversibility</h1>
      <button class="btn-outline" onclick="history.back()">← Back</button>
    </div>
    <p style="color: var(--text-dim); margin-bottom: 30px;">
      People make mistakes. All major deletions, edits, and availability updates on Kindred Guild are fully reversible within a 24-hour grace window.
    </p>
    <div id="actionHistoryContainer">
      <!-- Action history will be rendered here -->
    </div>
    <div style="margin-top: 40px;">
      <a href="quest-board.html" style="color: var(--accent); text-decoration: none; font-weight: bold;">← Back to Board</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="undo-actions.js"></script>
</body>
</html>
