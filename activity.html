  <style>
    .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--border); }
    .page-header h2 { color:var(--accent); font-size:1.4rem; }
    .activity-list { display:flex; flex-direction:column; gap:6px; }
    .activity-item { display:flex; gap:12px; padding:12px 16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); transition:all 0.12s; }
    .activity-item:hover { border-color:var(--accent); }
    .activity-icon { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.95rem; flex-shrink:0; }
    .activity-icon.quest { background:rgba(96,165,250,0.12); color:#60a5fa; }
    .activity-icon.wish { background:rgba(234,179,8,0.12); color:#eab308; }
    .activity-icon.user { background:rgba(16,185,129,0.12); color:#10b981; }
    .activity-icon.worker { background:rgba(168,85,247,0.12); color:#a855f7; }
    .activity-icon.dispute { background:rgba(239,68,68,0.12); color:#ef4444; }
    .activity-body { flex:1; min-width:0; }
    .activity-text { font-size:0.88rem; color:var(--text); line-height:1.4; }
    .activity-text strong { color:var(--accent); }
    .activity-text a { color:#60a5fa; text-decoration:none; }
    .activity-text a:hover { text-decoration:underline; }
    .activity-time { font-size:0.7rem; color:var(--text-dim); margin-top:3px; }
    .empty-state { text-align:center; padding:40px; color:var(--text-dim); }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h2>📰 Activity Feed</h2>
      <div style="display:flex;gap:8px;">
        <a href="quest-board.html" class="btn btn-ghost btn-sm">← Quest Board</a>
        <button class="btn btn-ghost btn-sm" onclick="loadActivity()">🔄 Refresh</button>
      </div>
    </div>
    <div class="activity-list" id="activityList">
      <div class="empty-state">Loading recent activity...</div>
    </div>
    <div id="loadMoreWrap" style="text-align:center;margin-top:16px;display:none">
      <button class="btn btn-ghost" onclick="loadMoreActivity()">Load More</button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    const PAGE_SIZE = 30;
    let actOffset = 0, actDone = false;
    const ACT_ICONS = {
      quest_posted:{icon:'📝',cls:'quest'},quest_accepted:{icon:'🤝',cls:'quest'},
      quest_completed:{icon:'✅',cls:'quest'},quest_approved:{icon:'🎉',cls:'quest'},
      wish_created:{icon:'✨',cls:'wish'},wish_backed:{icon:'🪙',cls:'wish'},
      dispute_filed:{icon:'⚠️',cls:'dispute'},user_joined:{icon:'👋',cls:'user'},
      worker_available:{icon:'🔧',cls:'worker'}
    };

    (async function(){ await window.requireAuth(); await loadActivity(); })();

    async function loadActivity() {
      const c = document.getElementById('activityList');
      c.innerHTML = '<div class="empty-state">Loading...</div>';
      actOffset = 0; actDone = false;
      const { data } = await window.sb.from('activity_feed').select('*, actor:user_profiles!activity_feed_actor_id_fkey(username, display_name)').order('created_at',{ascending:false}).range(0,PAGE_SIZE-1);
      if (!data||!data.length) { c.innerHTML='<div class="empty-state">No activity yet.</div>'; return; }
      actOffset = data.length; if (data.length<PAGE_SIZE) actDone = true;
      c.innerHTML = data.map(renderAct).join('');
      document.getElementById('loadMoreWrap').style.display = actDone?'none':'block';
    }

    window.loadMoreActivity = async function() {
      if (actDone) return;
      const { data } = await window.sb.from('activity_feed').select('*, actor:user_profiles!activity_feed_actor_id_fkey(username, display_name)').order('created_at',{ascending:false}).range(actOffset,actOffset+PAGE_SIZE-1);
      if (!data||!data.length) { actDone=true; document.getElementById('loadMoreWrap').style.display='none'; return; }
      actOffset += data.length; if (data.length<PAGE_SIZE) actDone=true;
      document.getElementById('activityList').insertAdjacentHTML('beforeend', data.map(renderAct).join(''));
      document.getElementById('loadMoreWrap').style.display = actDone?'none':'block';
    };

    function renderAct(a) {
      const actor = a.actor?.display_name||a.actor?.username||'Someone';
      const {icon,cls} = ACT_ICONS[a.action_type]||{icon:'📌',cls:'user'};
      const title = a.metadata?.title||'';
      const link = a.target_type==='quest'?`quest-detail.html?id=${a.target_id}`:a.target_type==='wish'?'fairy-wishes.html':null;
      const t = {
        quest_posted:`<strong>${escapeHtml(actor)}</strong> posted a quest${title?': ':''}${title?`<a href="${link}">${escapeHtml(title)}</a>`:''}`,
        quest_accepted:`<strong>${escapeHtml(actor)}</strong> accepted a quest${title?': ':''}${title?`<a href="${link}">${escapeHtml(title)}</a>`:''}`,
        quest_completed:`<strong>${escapeHtml(actor)}</strong> completed a quest${title?': ':''}${title?`<a href="${link}">${escapeHtml(title)}</a>`:''}`,
        quest_approved:`<strong>${escapeHtml(actor)}</strong> approved work${title?': ':''}${title?`<a href="${link}">${escapeHtml(title)}</a>`:''}`,
        wish_created:`<strong>${escapeHtml(actor)}</strong> created a wish${title?': ':''}${escapeHtml(title)}`,
        wish_backed:`<strong>${escapeHtml(actor)}</strong> backed a wish${title?': ':''}${escapeHtml(title)}`,
        dispute_filed:`<strong>${escapeHtml(actor)}</strong> filed a dispute${title?' on: ':''}${escapeHtml(title)}`,
        user_joined:`<strong>${escapeHtml(actor)}</strong> joined the Guild! 🎉`,
        worker_available:`<strong>${escapeHtml(actor)}</strong> is available for hire${title?': ':''}${escapeHtml(title)}`
      };
      return `<div class="activity-item"><div class="activity-icon ${cls}">${icon}</div><div class="activity-body"><div class="activity-text">${t[a.action_type]||escapeHtml(a.action_type)}</div><div class="activity-time">${timeAgo(a.created_at)}</div></div></div>`;
    }
  </script>
  <script src="site-nav.js"></script>
</body>
</html>
