<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindred Guild — Adventurers for Hire</title>
  <style>
    :root {
      --bg: #09090c;
      --surface: #12121a;
      --surface-2: #1e1e2c;
      --text: #e1e1e9;
      --text-dim: #8b8b9c;
      --accent: #c9a84c;
      --border: #222230;
      --success: #10b981;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      padding: 40px 20px;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    .post-form { background: var(--surface); padding: 30px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .worker-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; transition: border-color 0.2s; }
    .worker-card:hover { border-color: var(--accent); }
    .badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; background: var(--surface-2); color: var(--accent); margin-bottom: 12px; font-weight: bold; }
    .card-footer { margin-top: auto; padding-top: 20px; display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed var(--border); }
    .action-btn { padding: 10px 20px; background: var(--accent); color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
    .action-btn:hover { opacity: 0.9; }
    .action-btn.own { background: #ef4444; color: #fff; }
    .form-group { margin-bottom: 15px; }
    input, textarea, select { width: 100%; padding: 12px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    /* Interactive Scroll Cue */
    .scroll-cue {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 90;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      background: var(--accent);
      color: #000;
      border: none;
      cursor: pointer;
      font-weight: bold;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
      60% { transform: translateY(-3px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 style="font-family: 'Cinzel', 'Georgia', serif; color: var(--accent); letter-spacing: 1px;">⚔️ Adventurers for Hire</h1>
      <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
        <a href="index.html" class="btn-outline">🏠 Home</a>
        <button class="btn-outline" onclick="history.back()">← Back</button>
        <span>Active Fellow: <strong id="userName" style="color: var(--accent);">...</strong></span>
      </div>
    </div>

    <div class="post-form">
      <h3 style="color: var(--accent); margin-bottom: 8px;">Declare or Revise Your Availability</h3>
      <p style="color: var(--text-dim); margin-bottom: 20px; font-size: 0.95rem;">Outline your expertise, establish economic terms, and dynamically alter your rate appraisals whenever your schedule shifts.</p>
      <div id="workerMessage" style="padding: 12px; border-radius: 8px; margin-bottom: 15px; display: none;"></div>
      <div class="form-group">
        <input type="text" id="workerTitle" placeholder="Expertise Title (e.g. Logo Crafting, System Setup, Portfolio Design)">
      </div>
      <div class="form-group">
        <textarea id="workerDescription" placeholder="Outline your skills, previous builds, availability schedules..."></textarea>
      </div>
      <div class="form-group">
        <input type="text" id="workerTags" placeholder="Hashtag Tags (e.g., #Coding, #Design, #Art)">
      </div>
      <div style="display: flex; gap: 20px; flex-wrap: wrap;">
        <div class="form-group" style="flex: 1; min-width: 200px;">
          <select id="preferredPayment">
            <option value="any">Any Economic Settlement Mode</option>
            <option value="coins">Fairy Coins Only</option>
            <option value="upi">UPI Direct Only</option>
            <option value="free">Free / Gift Space Only</option>
          </select>
        </div>
        <div class="form-group" style="flex: 1; min-width: 200px;">
          <input type="number" id="minReward" placeholder="Min Appraisal Payout (Optional)">
        </div>
      </div>
      <button id="submitWorkerPostBtn" class="action-btn" onclick="handleSubmitWorkerPost()">Post Availability</button>
    </div>

    <div id="workerGrid" class="grid">
      <!-- Worker cards will be rendered here -->
    </div>
  </div>

  <button type="button" class="scroll-cue" onclick="window.scrollBy({ top: window.innerHeight * 0.7, behavior: 'smooth' })" title="Explore available adventurers below">↓</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="worker-post.js"></script>
</body>
</html>
