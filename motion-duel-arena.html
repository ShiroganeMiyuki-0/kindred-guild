<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09111f">
  <meta name="description" content="Play the current Anime Motion Fighter build from Kindred Guild. Use webcam motion tracking, keyboard, or mobile touch controls.">
  <title>Anime Motion Fighter — Kindred Guild</title>
  <style>
    :root { color-scheme: dark; --bar-height: 56px; --ink: #09111f; --panel: #101b2d; --line: rgba(148,163,184,.2); --gold: #f4c76b; --muted: #a8b4c8; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: #f7f8fc; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; }
    .topbar { height: var(--bar-height); flex: 0 0 var(--bar-height); display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 0 18px; border-bottom: 1px solid var(--line); background: rgba(10,18,32,.96); }
    .back, .open { color: var(--gold); text-decoration: none; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .back:hover, .open:hover { color: #ffe5a3; }
    .title { min-width: 0; text-align: center; font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .subtitle { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: .02em; text-transform: none; }
    .game-frame { flex: 1 1 auto; min-height: 0; width: 100%; border: 0; background: #020617; }
    @media (max-width: 560px) { :root { --bar-height: 52px; } .topbar { gap: 8px; padding: 0 10px; } .title { font-size: 10px; letter-spacing: .08em; } .subtitle { display: none; } .back, .open { font-size: 11px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="back" href="index.html" aria-label="Back to Kindred Guild">← Kindred Guild</a>
    <div class="title">Anime Motion Fighter<span class="subtitle">Webcam · Keyboard · Touch</span></div>
    <a class="open" href="anime-motion-fighter/" target="_blank" rel="noopener noreferrer">Open full page ↗</a>
  </header>
  <iframe class="game-frame" src="anime-motion-fighter/" title="Anime Motion Fighter game" allow="camera; microphone; autoplay; fullscreen; accelerometer; gyroscope" allowfullscreen></iframe>
</body>
</html>
