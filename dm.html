  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/layout-fix.css">
  <style>
    .dm-layout { display:grid; grid-template-columns:300px 1fr; gap:0; height:calc(100vh - 120px); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--surface); }
    @media(max-width:768px) { .dm-layout { grid-template-columns:1fr; height:auto; } .dm-sidebar { display:none; } .dm-sidebar.mobile-open { display:flex; position:fixed; inset:0; z-index:100; background:var(--surface); } }

    .dm-sidebar { background:var(--surface-2); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow-y:auto; }
    .dm-sidebar-header { padding:14px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    .dm-sidebar-header h3 { font-size:0.85rem; color:var(--accent); text-transform:uppercase; letter-spacing:1px; }
    .conv-list { list-style:none; padding:0; flex:1; overflow-y:auto; }
    .conv-item { padding:12px 14px; cursor:pointer; display:flex; gap:10px; align-items:center; border-bottom:1px solid rgba(255,255,255,0.03); transition:all 0.12s; }
    .conv-item:hover { background:rgba(212,175,55,0.06); }
    .conv-item.active { background:var(--accent-glow); }
    .conv-avatar { width:40px; height:40px; border-radius:50%; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--accent); font-size:0.9rem; flex-shrink:0; }
    .conv-info { flex:1; min-width:0; }
    .conv-name { font-weight:600; font-size:0.88rem; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .conv-last { font-size:0.75rem; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .conv-time { font-size:0.65rem; color:var(--text-dim); flex-shrink:0; }
    .conv-unread { width:18px; height:18px; border-radius:50%; background:var(--accent); color:#000; font-size:0.65rem; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

    .dm-chat { display:flex; flex-direction:column; }
    .dm-chat-header { padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .dm-chat-header h4 { color:var(--text); font-size:1rem; }
    .dm-messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; min-height:300px; }
    .dm-msg { display:flex; gap:10px; padding:4px 0; }
    .dm-msg.own { flex-direction:row-reverse; }
    .dm-msg-avatar { width:32px; height:32px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:0.8rem; color:var(--accent); flex-shrink:0; font-weight:700; }
    .dm-msg-bubble { max-width:70%; padding:10px 14px; border-radius:16px; font-size:0.88rem; line-height:1.4; }
    .dm-msg:not(.own) .dm-msg-bubble { background:var(--surface-2); color:var(--text); border-bottom-left-radius:4px; }
    .dm-msg.own .dm-msg-bubble { background:var(--accent); color:#000; border-bottom-right-radius:4px; }
    .dm-msg-time { font-size:0.65rem; color:var(--text-dim); margin-top:2px; }
    .dm-msg.own .dm-msg-time { text-align:right; }
    .dm-input-area { padding:12px 16px; border-top:1px solid var(--border); }
    .dm-input-form { display:flex; gap:8px; }
    .dm-input-form input { flex:1; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 14px; color:var(--text); font-size:0.9rem; outline:none; }
    .dm-input-form input:focus { border-color:var(--accent); }

    .dm-empty { display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-dim); font-size:0.9rem; }

    /* Invite modal */
    .invite-modal { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:9999; display:none; align-items:center; justify-content:center; padding:20px; }
    .invite-modal.show { display:flex; }
    .invite-modal-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:28px; max-width:420px; width:100%; }
    .user-search-result { padding:10px 12px; cursor:pointer; display:flex; gap:10px; align-items:center; border-radius:var(--radius-sm); transition:all 0.12s; }
    .user-search-result:hover { background:var(--accent-glow); }

    /* Group creation */
    .group-create-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:9999; display:none; align-items:center; justify-content:center; padding:20px; }
    .group-create-overlay.show { display:flex; }
    .group-create-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:28px; max-width:480px; width:100%; }
    .group-create-box h3 { color:var(--accent); margin-bottom:16px; }
    .member-chip { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; background:var(--accent-glow); border:1px solid var(--accent); border-radius:20px; font-size:0.75rem; color:var(--accent); margin:2px; }
    .member-chip button { background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:0.8rem; padding:0 2px; }
  </style>

<body>
  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2 style="color:var(--accent); font-size:1.4rem;">💬 Messages</h2>
      <div style="display:flex;gap:8px;">
        <a href="guild-hall.html" class="btn btn-ghost btn-sm">🏰 Guild Hall</a>
        <a href="quest-board.html" class="btn btn-ghost btn-sm">⚔️ Quest Board</a>
      </div>
    </div>

    <div class="dm-layout">
      <!-- Conversations sidebar -->
      <div class="dm-sidebar" id="dmSidebar">
        <div class="dm-sidebar-header">
          <h3>Messages</h3>
          <div style="display:flex;gap:4px;">
            <button class="btn btn-outline btn-xs" onclick="showNewGroup()" title="Create Group">👥+</button>
            <button class="btn btn-outline btn-xs" onclick="showNewChat()" title="New Chat">✏️</button>
          </div>
        </div>
        <div style="padding:10px 12px;border-bottom:1px solid var(--border);">
          <input type="text" id="sidebarSearch" placeholder="🔍 Search people to message..." style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;color:var(--text);font-size:0.85rem;outline:none;" oninput="searchUsers()">
        </div>
        <div id="sidebarSearchResults" style="border-bottom:1px solid var(--border);max-height:300px;overflow-y:auto;"></div>
        <ul class="conv-list" id="convList">
          <li style="padding:20px;text-align:center;color:var(--text-dim);font-size:0.85rem;">Loading...</li>
        </ul>
      </div>

      <!-- Chat area -->
      <div class="dm-chat" id="dmChat">
        <div class="dm-empty">
          <div style="text-align:center;">
            <div style="font-size:3rem;margin-bottom:12px;">💬</div>
            <p>Select a conversation or start a new one</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- New Chat Modal -->
  <div class="group-create-overlay" id="newChatModal">
    <div class="group-create-box">
      <h3>💬 Start New Chat</h3>
      <input type="text" id="userSearchInput" placeholder="Search by username..." oninput="searchNewChatUsers()">
      <div id="userSearchResults" style="max-height:250px;overflow-y:auto;margin-top:8px;"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
        <button class="btn btn-ghost" onclick="hideNewChat()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Create Group Modal -->
  <div class="group-create-overlay" id="newGroupModal">
    <div class="group-create-box">
      <h3>👥 Create Group</h3>
      <div class="form-group">
        <label>Group Name</label>
        <input type="text" id="newGroupName" placeholder="e.g. Study Group, Project Team..." maxlength="50">
      </div>
      <div class="form-group">
        <label>Add Members</label>
        <input type="text" id="groupMemberSearch" placeholder="Search by username..." oninput="searchGroupMembers()">
        <div id="groupMemberResults" style="max-height:200px;overflow-y:auto;margin-top:8px;"></div>
      </div>
      <div id="groupSelectedMembers" style="margin-bottom:12px;"></div>
      <div id="createGroupMsg" style="display:none;margin-bottom:12px;font-size:0.85rem;"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn btn-ghost" onclick="hideNewGroup()">Cancel</button>
        <button class="btn btn-primary" onclick="createGroupFromDm()">Create Group</button>
      </div>
    </div>
  </div>

  <!-- Invite to Group Modal -->
  <div class="group-create-overlay" id="inviteModal">
    <div class="group-create-box">
      <h3>👥 Add Member to Group</h3>
      <input type="text" id="inviteSearchInput" placeholder="Search by username..." oninput="searchInviteUsers()">
      <div id="inviteSearchResults" style="max-height:250px;overflow-y:auto;margin-top:8px;"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
        <button class="btn btn-ghost" onclick="hideInvite()">Done</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    let currentUser = null;
    let conversations = [];
    let activeConvId = null;
    let activeConv = null;
    let dmSubscription = null;
    let searchTimeout = null;

    (async function init() {
      const user = await window.requireAuth();
      if (!user) return;
      currentUser = user;
      await loadConversations();
    })();

    async function loadConversations() {
      try {
        const { data, error } = await window.sb.rpc('get_my_conversations');
        if (error) {
          // DM tables probably don't exist yet
          conversations = [];
          document.getElementById('convList').innerHTML = '<li style="padding:16px;text-align:center;"><div style="color:var(--accent);font-weight:600;margin-bottom:8px;">⚠️ DMs Not Set Up Yet</div><div style="color:var(--text-dim);font-size:0.8rem;line-height:1.5;">The messaging system needs database tables. Ask the admin to run the SQL migration.</div></li>';
          return;
        }
        conversations = data || [];
        renderConvList();
      } catch (err) {
        conversations = [];
        document.getElementById('convList').innerHTML = '<li style="padding:16px;text-align:center;color:var(--text-dim);font-size:0.85rem;">Could not load conversations.</li>';
      }
    }

    function renderConvList() {
      const list = document.getElementById('convList');
      if (conversations.length === 0) {
        list.innerHTML = '<li style="padding:20px;text-align:center;color:var(--text-dim);font-size:0.85rem;">No conversations yet. Click + New to start one.</li>';
        return;
      }

      list.innerHTML = conversations.map(c => {
        const name = c.is_group ? (c.name || 'Group Chat') : (c.other_display_name || c.other_username || 'Unknown');
        const initial = name.charAt(0).toUpperCase();
        const isActive = c.conversation_id === activeConvId;
        const lastMsg = c.last_message ? c.last_message.substring(0, 40) : 'No messages yet';
        const time = c.last_message_at ? window.timeAgo(c.last_message_at) : '';
        const unread = c.unread_count > 0 ? `<span class="conv-unread">${c.unread_count > 9 ? '9+' : c.unread_count}</span>` : '';

        return `
          <li class="conv-item ${isActive ? 'active' : ''}" onclick="openConversation('${c.conversation_id}')">
            <div class="conv-avatar">${initial}</div>
            <div class="conv-info">
              <div class="conv-name">${escapeHtml(name)}</div>
              <div class="conv-last">${escapeHtml(lastMsg)}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
              <span class="conv-time">${time}</span>
              ${unread}
            </div>
          </li>`;
      }).join('');
    }

    async function openConversation(convId) {
      activeConvId = convId;
      activeConv = conversations.find(c => c.conversation_id === convId);

      // Clear search
      const searchInput = document.getElementById('sidebarSearch');
      if (searchInput) searchInput.value = '';
      const searchResults = document.getElementById('sidebarSearchResults');
      if (searchResults) searchResults.innerHTML = '';

      // Mark as read
      await window.sb.from('dm_participants').update({ last_read_at: new Date().toISOString() }).eq('conversation_id', convId).eq('user_id', currentUser.id);

      renderConvList();
      await loadDmMessages();
      subscribeToDm();

      // Close mobile sidebar
      document.getElementById('dmSidebar').classList.remove('mobile-open');
    }

    async function loadDmMessages() {
      const chatArea = document.getElementById('dmChat');
      chatArea.innerHTML = `
        <div class="dm-chat-header">
          <div>
            <h4>${escapeHtml(activeConv?.is_group ? (activeConv?.name || 'Group Chat') : (activeConv?.other_display_name || activeConv?.other_username || 'Unknown'))}</h4>
          </div>
          <div style="display:flex;gap:8px;">
            ${activeConv?.is_group ? '<button class="btn btn-ghost btn-xs" onclick="showInvite()">👥 Add Member</button>' : ''}
            <button class="btn btn-ghost btn-xs" onclick="toggleDmSidebar()" style="display:none;" id="dmMobileBtn">☰</button>
          </div>
        </div>
        <div class="dm-messages" id="dmMessages"><div style="text-align:center;color:var(--text-dim);padding:20px;">Loading...</div></div>
        <div class="dm-input-area">
          <form class="dm-input-form" onsubmit="event.preventDefault();sendDmMessage()">
            <input type="text" id="dmInput" placeholder="Type a message..." maxlength="2000" autocomplete="off">
            <button type="submit" class="btn btn-primary">Send</button>
          </form>
        </div>`;

      // Show mobile button
      const mobileBtn = document.getElementById('dmMobileBtn');
      if (mobileBtn && window.innerWidth <= 768) mobileBtn.style.display = 'block';

      const { data } = await window.sb
        .from('dm_messages')
        .select('*, author:user_profiles!dm_messages_user_id_fkey(username, display_name)')
        .eq('conversation_id', activeConvId)
        .eq('is_deleted', false)
        .order('created_at', { ascending: true })
        .limit(200);

      const messages = data || [];
      const container = document.getElementById('dmMessages');

      if (messages.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:40px;">No messages yet. Say hello! 👋</div>';
        return;
      }

      container.innerHTML = messages.map(m => {
        const isOwn = m.user_id === currentUser.id;
        const name = m.author?.display_name || m.author?.username || 'Member';
        const initial = name.charAt(0).toUpperCase();
        const time = window.timeAgo(m.created_at);

        return `
          <div class="dm-msg ${isOwn ? 'own' : ''}">
            ${isOwn ? '' : `<div class="dm-msg-avatar">${initial}</div>`}
            <div>
              <div class="dm-msg-bubble">${escapeHtml(m.content)}</div>
              <div class="dm-msg-time">${time}</div>
            </div>
          </div>`;
      }).join('');

      container.scrollTop = container.scrollHeight;
    }

    async function sendDmMessage() {
      const input = document.getElementById('dmInput');
      const content = input.value.trim();
      if (!content || !activeConvId) return;
      input.value = '';

      const { error } = await window.sb.rpc('send_dm_message', {
        p_conversation_id: activeConvId,
        p_content: content
      });

      if (error) {
        window.showToast('Failed to send: ' + error.message, 'error');
        input.value = content;
        return;
      }

      await loadDmMessages();
      await loadConversations();
    }

    function subscribeToDm() {
      if (dmSubscription) dmSubscription.unsubscribe();
      dmSubscription = window.sb
        .channel('dm-realtime-' + activeConvId)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'dm_messages', filter: 'conversation_id=eq.' + activeConvId }, () => {
          loadDmMessages();
          loadConversations();
        })
        .subscribe();
    }

    // searchUsers is used by sidebar search
    window.searchUsers = function () {
      clearTimeout(searchTimeout);
      const searchContainer = document.getElementById('sidebarSearchResults');
      searchTimeout = setTimeout(async () => {
        const term = document.getElementById('sidebarSearch').value.trim();
        if (term.length < 2) {
          if (searchContainer) searchContainer.innerHTML = '';
          return;
        }

        const { data } = await window.sb.from('user_profiles')
          .select('user_id, username, display_name')
          .or(`username.ilike.%${term}%,display_name.ilike.%${term}%`)
          .neq('user_id', currentUser.id)
          .limit(8);

        const results = data || [];
        if (!searchContainer) return;
        searchContainer.innerHTML = results.length === 0
          ? '<div style="padding:12px;color:var(--text-dim);text-align:center;font-size:0.85rem;">No users found</div>'
          : results.map(u => `
            <div class="user-search-result" onclick="startDm('${u.user_id}', '${escapeHtml(u.username)}')" style="padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center;border-radius:var(--radius-sm);transition:all 0.12s;">
              <div style="width:36px;height:36px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);font-size:0.85rem;">${(u.display_name || u.username || '?').charAt(0).toUpperCase()}</div>
              <div>
                <div style="font-weight:600;font-size:0.88rem;">${escapeHtml(u.display_name || u.username)}</div>
                <div style="font-size:0.75rem;color:var(--text-dim);">@${escapeHtml(u.username)}</div>
              </div>
            </div>`).join('');
      }, 300);
    };

    window.startDm = async function (userId, username) {
      try {
        const { data: convId, error } = await window.sb.rpc('get_or_create_dm', { p_other_user_id: userId });
        if (error) {
          if (error.message && error.message.includes('does not exist')) {
            window.showToast('Messaging system not set up yet. Admin needs to run the SQL migration.', 'warning');
          } else {
            window.showToast('Failed: ' + error.message, 'error');
          }
          return;
        }
        await loadConversations();
        openConversation(convId);
      } catch (err) {
        window.showToast('Messaging not available yet. Contact admin.', 'warning');
      }
    };

    window.toggleDmSidebar = function () {
      document.getElementById('dmSidebar').classList.toggle('mobile-open');
    };

    // ── New Chat Modal ──
    let _newChatSearchTimeout = null;
    window.showNewChat = function() {
      document.getElementById('newChatModal').classList.add('show');
      document.getElementById('userSearchInput').value = '';
      document.getElementById('userSearchResults').innerHTML = '';
      document.getElementById('userSearchInput').focus();
    };
    window.hideNewChat = function() {
      document.getElementById('newChatModal').classList.remove('show');
    };
    window.searchNewChatUsers = function() {
      clearTimeout(_newChatSearchTimeout);
      _newChatSearchTimeout = setTimeout(async () => {
        const term = document.getElementById('userSearchInput').value.trim();
        if (term.length < 2) { document.getElementById('userSearchResults').innerHTML = ''; return; }
        const { data } = await window.sb.from('user_profiles')
          .select('user_id, username, display_name')
          .or(`username.ilike.%${term}%,display_name.ilike.%${term}%`)
          .neq('user_id', currentUser.id).limit(8);
        const results = data || [];
        document.getElementById('userSearchResults').innerHTML = results.length === 0
          ? '<div style="padding:12px;color:var(--text-dim);text-align:center;font-size:0.85rem;">No users found</div>'
          : results.map(u => {
              const name = u.display_name || u.username;
              return `<div class="user-search-result" onclick="startNewChatWith('${u.user_id}')">
                <div style="width:36px;height:36px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);font-size:0.85rem;">${name.charAt(0).toUpperCase()}</div>
                <div><div style="font-weight:600;font-size:0.88rem;">${escapeHtml(name)}</div><div style="font-size:0.75rem;color:var(--text-dim);">@${escapeHtml(u.username)}</div></div>
              </div>`;
            }).join('');
      }, 300);
    };
    window.startNewChatWith = async function(userId) {
      try {
        const { data: convId, error } = await window.sb.rpc('get_or_create_dm', { p_other_user_id: userId });
        if (error) { window.showToast('Failed: ' + error.message, 'error'); return; }
        hideNewChat();
        await loadConversations();
        openConversation(convId);
      } catch (err) { window.showToast('Messaging not available.', 'warning'); }
    };

    // ── Create Group from DM page ──
    let _groupMemberIds = [];
    let _groupMemberNames = {};
    window.showNewGroup = function() {
      document.getElementById('newGroupModal').classList.add('show');
      document.getElementById('newGroupName').value = '';
      document.getElementById('groupMemberSearch').value = '';
      document.getElementById('groupMemberResults').innerHTML = '';
      _groupMemberIds = [];
      _groupMemberNames = {};
      renderGroupSelectedMembers();
      document.getElementById('newGroupName').focus();
    };
    window.hideNewGroup = function() {
      document.getElementById('newGroupModal').classList.remove('show');
    };
    window.searchGroupMembers = async function() {
      const term = document.getElementById('groupMemberSearch').value.trim();
      if (term.length < 2) { document.getElementById('groupMemberResults').innerHTML = ''; return; }
      const { data } = await window.sb.from('user_profiles')
        .select('user_id, username, display_name')
        .or(`username.ilike.%${term}%,display_name.ilike.%${term}%`)
        .neq('user_id', currentUser.id).limit(8);
      const results = data || [];
      document.getElementById('groupMemberResults').innerHTML = results.map(u => {
        const name = u.display_name || u.username;
        const sel = _groupMemberIds.includes(u.user_id);
        return `<div class="user-search-result ${sel ? 'selected' : ''}" onclick="toggleGroupMember('${u.user_id}','${escapeHtml(name)}')">
          <div style="width:32px;height:32px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);font-size:0.8rem;">${name.charAt(0).toUpperCase()}</div>
          <div><div style="font-weight:600;font-size:0.85rem;">${escapeHtml(name)}</div><div style="font-size:0.7rem;color:var(--text-dim);">@${escapeHtml(u.username)}</div></div>
          ${sel ? '<span style="margin-left:auto;color:var(--accent);">✓</span>' : ''}
        </div>`;
      }).join('');
    };
    window.toggleGroupMember = function(userId, name) {
      const idx = _groupMemberIds.indexOf(userId);
      if (idx >= 0) { _groupMemberIds.splice(idx, 1); delete _groupMemberNames[userId]; }
      else { _groupMemberIds.push(userId); _groupMemberNames[userId] = name; }
      renderGroupSelectedMembers();
      searchGroupMembers();
    };
    function renderGroupSelectedMembers() {
      const c = document.getElementById('groupSelectedMembers');
      if (_groupMemberIds.length === 0) { c.innerHTML = ''; return; }
      c.innerHTML = '<div style="font-size:0.75rem;color:var(--text-dim);margin-bottom:6px;">Selected:</div>' + _groupMemberIds.map(id => {
        const name = _groupMemberNames[id] || 'Member';
        return `<span class="member-chip">${escapeHtml(name)} <button onclick="toggleGroupMember('${id}','${escapeHtml(name)}')">×</button></span>`;
      }).join('');
    }
    window.createGroupFromDm = async function() {
      const name = document.getElementById('newGroupName').value.trim();
      const msgEl = document.getElementById('createGroupMsg');
      if (!name) { msgEl.textContent = 'Enter a group name.'; msgEl.style.display = 'block'; msgEl.style.color = 'var(--error)'; return; }
      if (_groupMemberIds.length === 0) { msgEl.textContent = 'Add at least one member.'; msgEl.style.display = 'block'; msgEl.style.color = 'var(--error)'; return; }
      try {
        const { data: convId, error } = await window.sb.rpc('create_group_conversation', { p_name: name, p_member_ids: _groupMemberIds });
        if (error) {
          // Fallback
          const { data: conv, error: e2 } = await window.sb.from('dm_conversations').insert({ name, is_group: true, created_by: currentUser.id }).select('id').single();
          if (e2) { msgEl.textContent = 'Failed: ' + e2.message; msgEl.style.display = 'block'; msgEl.style.color = 'var(--error)'; return; }
          const all = [...new Set([currentUser.id, ..._groupMemberIds])];
          await window.sb.from('dm_participants').insert(all.map(uid => ({ conversation_id: conv.id, user_id: uid, role: uid === currentUser.id ? 'admin' : 'member' })));
        }
        msgEl.textContent = '✅ Group created!'; msgEl.style.display = 'block'; msgEl.style.color = 'var(--success)';
        setTimeout(async () => { hideNewGroup(); await loadConversations(); }, 1000);
      } catch (err) { msgEl.textContent = 'Failed: ' + err.message; msgEl.style.display = 'block'; msgEl.style.color = 'var(--error)'; }
    };

    // ── Invite to Group ──
    window.showInvite = function() {
      if (!activeConvId) return;
      document.getElementById('inviteModal').classList.add('show');
      document.getElementById('inviteSearchInput').value = '';
      document.getElementById('inviteSearchResults').innerHTML = '';
      document.getElementById('inviteSearchInput').focus();
    };
    window.hideInvite = function() {
      document.getElementById('inviteModal').classList.remove('show');
    };
    window.searchInviteUsers = async function() {
      const term = document.getElementById('inviteSearchInput').value.trim();
      if (term.length < 2) { document.getElementById('inviteSearchResults').innerHTML = ''; return; }
      const { data } = await window.sb.from('user_profiles')
        .select('user_id, username, display_name')
        .or(`username.ilike.%${term}%,display_name.ilike.%${term}%`)
        .neq('user_id', currentUser.id).limit(8);
      const results = data || [];
      document.getElementById('inviteSearchResults').innerHTML = results.length === 0
        ? '<div style="padding:12px;color:var(--text-dim);text-align:center;">No users found</div>'
        : results.map(u => {
            const name = u.display_name || u.username;
            return `<div class="user-search-result" onclick="addUserToGroup('${u.user_id}','${escapeHtml(name)}')">
              <div style="width:32px;height:32px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);font-size:0.8rem;">${name.charAt(0).toUpperCase()}</div>
              <div><div style="font-weight:600;font-size:0.85rem;">${escapeHtml(name)}</div><div style="font-size:0.7rem;color:var(--text-dim);">@${escapeHtml(u.username)}</div></div>
              <span style="margin-left:auto;color:var(--accent);font-size:0.8rem;">+ Add</span>
            </div>`;
          }).join('');
    };
    window.addUserToGroup = async function(userId, name) {
      if (!activeConvId) return;
      try {
        const { error } = await window.sb.from('dm_participants').insert({ conversation_id: activeConvId, user_id: userId, role: 'member' });
        if (error) { window.showToast('Failed: ' + error.message, 'error'); return; }
        window.showToast(name + ' added to group!', 'success');
      } catch (err) { window.showToast('Failed to add member.', 'error'); }
    };
  </script>
  <script src="site-nav.js"></script>
</body>
</html>
