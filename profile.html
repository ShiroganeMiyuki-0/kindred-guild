<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindred Guild — Profile Dashboard</title>
  <style>
    :root {
      --bg: #0c0c0f;
      --surface: #14141e;
      --surface-2: #20202d;
      --text: #f0f0f5;
      --text-dim: #9494a8;
      --accent: #d4af37;
      --accent-glow: rgba(212, 175, 55, 0.15);
      --border: #262636;
      --error: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .header-bar a {
      color: var(--text-dim);
      text-decoration: none;
    }
    .header-bar a:hover { color: var(--accent); }

    .profile-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 24px;
    }

    .avatar-area {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 2px solid var(--accent);
      object-fit: cover;
    }

    .meta-details h2 {
      font-size: 1.6rem;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .meta-details .username {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-bottom: 8px;
    }
    .meta-details .rep-score {
      font-size: 1rem;
      font-weight: bold;
    }

    .tabs {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .tab {
      padding: 12px 20px;
      cursor: pointer;
      color: var(--text-dim);
      font-weight: bold;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: #0c0c0f;
    }

    .suspension-banner {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error);
      color: var(--error);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      font-weight: bold;
      text-align: center;
    }

    .quest-item {
      padding: 15px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .quest-item:last-child { border-bottom: none; }
    .quest-item a {
      color: var(--text);
      text-decoration: none;
      font-weight: bold;
    }
    .quest-item a:hover { color: var(--accent); }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <h2>Guild Member Hub</h2>
      <a href="quest-board.html">← Go to Board</a>
    </div>

    <div id="suspensionNotice" class="suspension-banner" style="display: none;">
      ⚠️ Account suspended due to unresolved disputes or security breaches.
    </div>

    <div class="profile-card">
      <div class="avatar-area">
        <img id="profileAvatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2314141e'/><text x='50%' y='55%' font-size='40' dominant-baseline='middle' text-anchor='middle'>👤</text></svg>" alt="Avatar" class="avatar">
        <div class="meta-details">
          <h2 id="profileDisplayName">--</h2>
          <div class="username" id="profileUsername">@--</div>
          <div class="rep-score">Reputation Rating: <span id="profileRepScore" style="color: var(--accent);">--</span></div>
          <div style="font-size: 0.85rem; color: var(--text-dim); margin-top: 6px;">
            Fairy Coins Balance: <strong id="privateBalanceDisplay" style="color: var(--accent);">--</strong> FC <span style="font-size: 0.75rem;">(Owner Only)</span>
          </div>
        </div>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="tab-posted" onclick="switchProfileTab('tab-posted')">Posted Quests</div>
      <div class="tab" data-tab="tab-completed" onclick="switchProfileTab('tab-completed')">Completed Tasks</div>
      <div class="tab" id="editProfileTabBtn" data-tab="tab-edit" onclick="switchProfileTab('tab-edit')" style="display: none;">Edit Settings</div>
    </div>

    <div id="tab-posted" class="tab-content active">
      <div class="card">
        <div id="postedQuestsList">
          <div style="color: var(--text-dim); padding: 10px;">Loading historical records...</div>
        </div>
      </div>
    </div>

    <div id="tab-completed" class="tab-content">
      <div class="card">
        <div id="completedQuestsList">
          <div style="color: var(--text-dim); padding: 10px;">Loading tasks list...</div>
        </div>
      </div>
    </div>

    <div id="tab-edit" class="tab-content">
      <div class="card">
        <div class="form-group">
          <label>Display Name</label>
          <input type="text" id="editDisplayName" placeholder="e.g. Aria Moonweaver">
        </div>
        <div class="form-group">
          <label>Avatar URL Link</label>
          <input type="text" id="editAvatarUrl" placeholder="https://image-links-here.com">
        </div>
        <button class="btn" onclick="saveProfileChanges()">Save Profile</button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="profile.js"></script>
</body>
</html>
