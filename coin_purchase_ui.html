<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindred Guild — Acquire Fairy Coins</title>
  <style>
    :root {
      --bg: #0c0c0f;
      --surface: #14141e;
      --surface-2: #20202d;
      --text: #f0f0f5;
      --text-dim: #9494a8;
      --accent: #d4af37;
      --accent-glow: rgba(212, 175, 55, 0.15);
      --border: #262636;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 { font-size: 1.5rem; color: var(--accent); }
    .header a { color: var(--text-dim); text-decoration: none; }

    .balance-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      text-align: center;
    }
    .balance-card span { font-size: 1.8rem; color: var(--accent); font-weight: bold; }

    .purchase-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    select, input {
      width: 100%;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
    }
    select:focus, input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .qr-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
    }
    .qr-placeholder {
      width: 180px;
      height: 180px;
      background: #fff;
      margin: 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 10px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #0c0c0f;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.5; }

    .message {
      padding: 12px;
      border-radius: 6px;
      margin-top: 16px;
      display: none;
    }
    .message.success { display: block; background: rgba(16, 185, 129, 0.15); color: var(--success); }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>💰 Acquire Fairy Coins</h1>
      <a href="quest-board.html">← Go to Board</a>
    </div>

    <div class="balance-card">
      <div>Active Coins Balance:</div>
      <span id="currentBalanceDisplay">--</span> FC
    </div>

    <div class="purchase-card">
      <form id="purchaseForm" onsubmit="event.preventDefault(); submitPaymentReference();">
        <div class="form-group">
          <label>Select Coins Package</label>
          <select id="coinPackage" onchange="updateQRValue()">
            <option value="100">100 Fairy Coins — ₹100</option>
            <option value="500">500 Fairy Coins — ₹500</option>
            <option value="1000">1000 Fairy Coins — ₹1000</option>
          </select>
        </div>

        <div class="qr-box">
          <h3>💳 UPI Payment Interface</h3>
          <p style="font-size: 0.85rem; color: var(--text-dim); margin-top: 6px;">Scan QR below or pay to: <strong>yashwanthrangaswamy72@okhdfcbank</strong></p>

          </div>
          <div style="margin-top: 12px;">Amount Due: <strong id="amountDueSpan" style="color: var(--accent);">₹100</strong></div>
        </div>

        <div class="form-group">
          <label>UPI Transaction Reference Number (UTR)</label>
          <input type="text" id="utrRef" placeholder="12-Digit Reference ID" required>
        </div>

        <button type="submit" id="submitPaymentBtn" class="btn">Log Transaction Details</button>
      </form>

      <div id="statusAlert" class="message success"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="coin_purchase_js_logic.js"></script>
</body>
</html>
