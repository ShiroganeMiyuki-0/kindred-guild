  <style>
    .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--border); }
    .page-header h2 { color:var(--accent); font-size:1.4rem; }
    .balance-card { background:linear-gradient(135deg,rgba(212,175,55,0.08),var(--surface)); border:1px solid var(--accent); border-radius:var(--radius); padding:24px; margin-bottom:24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; }
    .balance-card .label { font-size:0.8rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; }
    .balance-card .value { font-size:2rem; font-weight:800; color:var(--accent); }
    .balance-card .sub { font-size:0.8rem; color:var(--text-dim); margin-top:4px; }
    .ledger-table { width:100%; border-collapse:collapse; font-size:0.85rem; }
    .ledger-table th { padding:12px; text-align:left; color:var(--accent); text-transform:uppercase; font-size:0.7rem; letter-spacing:1px; background:var(--surface-2); border-bottom:1px solid var(--border); }
    .ledger-table td { padding:12px; border-bottom:1px solid var(--border); vertical-align:top; }
    .ledger-table tr:hover { background:rgba(212,175,55,0.03); }
    .amount-pos { color:var(--success); font-weight:700; }
    .amount-neg { color:var(--error); font-weight:700; }
    .reason-tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:0.7rem; font-weight:600; }
    .reason-tag.credit { background:rgba(16,185,129,0.1); color:#10b981; }
    .reason-tag.debit { background:rgba(239,68,68,0.1); color:#ef4444; }
    .balance-col { font-family:monospace; font-size:0.82rem; color:var(--text-dim); }
    .empty-state { text-align:center; padding:40px; color:var(--text-dim); }
    @media(max-width:768px) { .ledger-table th, .ledger-table td { padding:8px 6px; font-size:0.78rem; } }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h2>💰 Coin Ledger</h2>
      <div style="display:flex;gap:8px;">
        <a href="coin_purchase_ui.html" class="btn btn-ghost btn-sm">💰 Buy Coins</a>
        <a href="profile.html" class="btn btn-ghost btn-sm">← Profile</a>
      </div>
    </div>

    <div class="balance-card">
      <div>
        <div class="label">Current Balance</div>
        <div class="value" id="currentBalance">— FC</div>
        <div class="sub" id="balanceSummary">Loading...</div>
      </div>
      <div style="text-align:right">
        <div class="label">Total Earned</div>
        <div style="font-size:1.2rem;font-weight:700;color:var(--success)" id="totalEarned">—</div>
        <div class="label" style="margin-top:8px">Total Spent</div>
        <div style="font-size:1.2rem;font-weight:700;color:var(--error)" id="totalSpent">—</div>
      </div>
    </div>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;">
      <div style="padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
        <h3 style="color:var(--accent);font-size:1rem;">Transaction History</h3>
        <button class="btn btn-ghost btn-sm" onclick="loadLedger()">🔄 Refresh</button>
      </div>
      <div style="overflow-x:auto;">
        <table class="ledger-table">
          <thead>
            <tr><th>Date</th><th>Description</th><th>Quest</th><th>Amount</th><th>Balance</th></tr>
          </thead>
          <tbody id="ledgerBody">
            <tr><td colspan="5" class="empty-state">Loading transactions...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    (async function init() {
      const user = await window.requireAuth();
      if (!user) return;

      const { data: bal } = await window.sb.rpc('get_coin_balance', { p_user_id: user.id });
      document.getElementById('currentBalance').textContent = (bal || 0) + ' FC';

      const { data: stats } = await window.sb.rpc('get_profile_stats', { p_user_id: user.id });
      if (stats) {
        document.getElementById('totalEarned').textContent = '+' + (stats.total_earned || 0) + ' FC';
        document.getElementById('totalSpent').textContent = '-' + (stats.total_spent || 0) + ' FC';
        document.getElementById('balanceSummary').textContent = `${stats.total_earned || 0} earned · ${stats.total_spent || 0} spent`;
      }

      await loadLedger();
    })();

    const reasonLabels = {
      'upi_purchase': { text: 'UPI Purchase', type: 'credit' },
      'quest_earning': { text: 'Quest Payment', type: 'credit' },
      'wish_backing_refund': { text: 'Wish Refund', type: 'credit' },
      'wish_backing_commission_refund': { text: 'Commission Refund', type: 'credit' },
      'reward_decrease_refund': { text: 'Reward Refund', type: 'credit' },
      'commission_decrease_refund': { text: 'Commission Refund', type: 'credit' },
      'admin_quest_removal_refund': { text: 'Admin Refund', type: 'credit' },
      'admin_wish_removal_refund': { text: 'Admin Refund', type: 'credit' },
      'admin_commission_refund': { text: 'Admin Refund', type: 'credit' },
      'reward_locked_refund': { text: 'Quest Cancelled', type: 'credit' },
      'commission_locked_refund': { text: 'Commission Refund', type: 'credit' },
      'reward_type_change_refund': { text: 'Type Change Refund', type: 'credit' },
      'quest_commission': { text: 'Quest Commission', type: 'debit' },
      'commission_locked': { text: 'Commission Locked', type: 'debit' },
      'reward_locked': { text: 'Reward Locked', type: 'debit' },
      'wish_backing_locked': { text: 'Wish Backing', type: 'debit' },
      'wish_backing_commission': { text: 'Wish Fee', type: 'debit' },
      'wish_commission': { text: 'Wish Commission', type: 'debit' },
      'reward_increase_locked': { text: 'Reward Increase', type: 'debit' },
      'commission_increase_locked': { text: 'Commission Increase', type: 'debit' },
      'reward_type_change_locked': { text: 'Type Change Lock', type: 'debit' }
    };

    async function loadLedger() {
      const tbody = document.getElementById('ledgerBody');
      tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Loading...</td></tr>';

      const { data, error } = await window.sb.rpc('get_coin_ledger', { p_limit: 200 });

      if (error) {
        // Fallback: direct query
        const { data: ledger } = await window.sb.from('fairy_ledger').select('id, amount, reason, quest_id, created_at').eq('user_id', (await window.sb.auth.getUser()).data.user.id).order('created_at', { ascending: false }).limit(200);
        if (!ledger || ledger.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No transactions yet.</td></tr>';
          return;
        }
        renderLedger(ledger);
        return;
      }

      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No transactions yet.</td></tr>';
        return;
      }
      renderLedger(data);
    }

    function renderLedger(data) {
      const tbody = document.getElementById('ledgerBody');
      tbody.innerHTML = data.map(tx => {
        const isCredit = tx.amount > 0;
        const label = reasonLabels[tx.reason] || { text: tx.reason || 'Unknown', type: isCredit ? 'credit' : 'debit' };
        const date = new Date(tx.created_at).toLocaleString();
        const questLink = tx.quest_id ? `<a href="quest-detail.html?id=${tx.quest_id}" style="color:#60a5fa;text-decoration:none">${escapeHtml(tx.quest_title || 'View')}</a>` : '—';

        return `
          <tr>
            <td style="white-space:nowrap">${date}</td>
            <td><span class="reason-tag ${label.type}">${label.text}</span></td>
            <td>${questLink}</td>
            <td class="${isCredit ? 'amount-pos' : 'amount-neg'}">${isCredit ? '+' : ''}${tx.amount} FC</td>
            <td class="balance-col">${tx.balance_after !== undefined ? tx.balance_after + ' FC' : '—'}</td>
          </tr>`;
      }).join('');
    }
  </script>
  <script src="site-nav.js"></script>
</body>
</html>
