  <style>
    .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--border); }
    .page-header h2 { color:var(--accent); font-size:1.4rem; }
    .notif-list { display:flex; flex-direction:column; gap:6px; }
    .notif-item { display:flex; gap:12px; padding:14px 16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); transition:all 0.12s; cursor:pointer; }
    .notif-item:hover { border-color:var(--accent); }
    .notif-item.unread { border-left:3px solid var(--accent); background:rgba(212,175,55,0.03); }
    .notif-icon { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1rem; flex-shrink:0; }
    .notif-icon.quest { background:rgba(96,165,250,0.12); color:#60a5fa; }
    .notif-icon.wish { background:rgba(234,179,8,0.12); color:#eab308; }
    .notif-icon.warning { background:rgba(239,68,68,0.12); color:#ef4444; }
    .notif-icon.payment { background:rgba(16,185,129,0.12); color:#10b981; }
    .notif-icon.guild { background:rgba(168,85,247,0.12); color:#a855f7; }
    .notif-body { flex:1; min-width:0; }
    .notif-title { font-weight:600; font-size:0.9rem; color:var(--text); }
    .notif-text { font-size:0.82rem; color:var(--text-dim); margin-top:2px; line-height:1.4; }
    .notif-time { font-size:0.7rem; color:var(--text-dim); margin-top:4px; }
    .empty-state { text-align:center; padding:40px; color:var(--text-dim); }
  </style>
<meta property="og:title" content="Kindred Guild — Notifications">
  <meta property="og:description" content="Stay updated on quest activity, wish votes, and guild announcements.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Kindred Guild">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h2>🔔 Notifications</h2>
      <div style="display:flex;gap:8px;">
        <a href="dm.html" class="btn btn-ghost btn-sm">💬 Messages</a>
        <button class="btn btn-ghost btn-sm" onclick="markAllRead()">✓ Mark All Read</button>
        <button class="btn btn-ghost btn-sm" onclick="loadNotifications()">🔄 Refresh</button>
      </div>
    </div>

    <div class="notif-list" id="notifList">
      <div class="empty-state">Loading notifications...</div>
    </div>
    <div id="loadMoreNotifs" style="text-align:center;margin-top:16px;display:none">
      <button class="btn btn-ghost" onclick="loadMoreNotifs()">Load More</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    (async function init() {
      await window.requireAuth();
      await loadNotifications();
    })();

    const typeIcons = {
      quest_accepted: { icon: '🤝', cls: 'quest' },
      quest_submitted: { icon: '📤', cls: 'quest' },
      quest_approved: { icon: '🎉', cls: 'payment' },
      wish_backed: { icon: '🪙', cls: 'wish' },
      guild_reply: { icon: '💬', cls: 'guild' },
      admin_warning: { icon: '⚠️', cls: 'warning' },
      dispute_filed: { icon: '⚡', cls: 'warning' },
      payment_received: { icon: '💰', cls: 'payment' }
    };

    const NOTIF_PAGE = 30;
    let notifOffset = 0, notifDone = false;

    async function loadNotifications() {
      const container = document.getElementById('notifList');
      container.innerHTML = '<div class="empty-state">Loading...</div>';
      notifOffset = 0; notifDone = false;

      const { data } = await window.sb.from('notifications').select('*').order('created_at', { ascending: false }).range(0, NOTIF_PAGE - 1);

      if (!data || data.length === 0) {
        container.innerHTML = '<div class="empty-state">No notifications yet. They\'ll appear here when something happens!</div>';
        document.getElementById('loadMoreNotifs').style.display = 'none';
        return;
      }
      notifOffset = data.length; if (data.length < NOTIF_PAGE) notifDone = true;
      container.innerHTML = data.map(renderNotif).join('');
      document.getElementById('loadMoreNotifs').style.display = notifDone ? 'none' : 'block';
    }

    window.loadMoreNotifs = async function() {
      if (notifDone) return;
      const { data } = await window.sb.from('notifications').select('*').order('created_at', { ascending: false }).range(notifOffset, notifOffset + NOTIF_PAGE - 1);
      if (!data || !data.length) { notifDone = true; document.getElementById('loadMoreNotifs').style.display = 'none'; return; }
      notifOffset += data.length; if (data.length < NOTIF_PAGE) notifDone = true;
      document.getElementById('notifList').insertAdjacentHTML('beforeend', data.map(renderNotif).join(''));
      document.getElementById('loadMoreNotifs').style.display = notifDone ? 'none' : 'block';
    };

    function renderNotif(n) {
        const { icon, cls } = typeIcons[n.type] || { icon: '📌', cls: 'quest' };
        const unread = !n.is_read ? 'unread' : '';
        const time = timeAgo(n.created_at);
        return `
          <div class="notif-item ${unread}" onclick="handleNotifClick('${n.id}', '${n.link || ''}', ${!n.is_read})">
            <div class="notif-icon ${cls}">${icon}</div>
            <div class="notif-body">
              <div class="notif-title">${escapeHtml(n.title)}</div>
              ${n.body ? `<div class="notif-text">${escapeHtml(n.body)}</div>` : ''}
              <div class="notif-time">${time}</div>
            </div>
          </div>`;
    }

    async function handleNotifClick(notifId, link, isUnread) {
      if (isUnread) {
        await window.sb.from('notifications').update({ is_read: true }).eq('id', notifId);
      }
      if (link) {
        window.location.href = link;
      }
    }

    async function markAllRead() {
      await window.sb.rpc('mark_notifications_read');
      await loadNotifications();
    }
  </script>
  <script src="site-nav.js"></script>
</body>
</html>
