  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/fixes.css">
  <style>
    .search-container { max-width:700px; margin:0 auto; }
    .search-box { display:flex; gap:10px; margin-bottom:24px; }
    .search-box input { flex:1; font-size:1rem; padding:14px 18px; }
    .search-box button { padding:14px 24px; white-space:nowrap; }

    .user-card {
      display:flex; align-items:center; gap:16px; padding:16px 20px;
      background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
      margin-bottom:10px; transition:all 0.15s; cursor:pointer;
    }
    .user-card:hover { border-color:var(--accent); transform:translateX(4px); }
    .user-avatar {
      width:48px; height:48px; border-radius:50%; background:var(--surface-2);
      display:flex; align-items:center; justify-content:center; font-weight:700;
      color:var(--accent); font-size:1.1rem; border:2px solid var(--border); flex-shrink:0; overflow:hidden;
    }
    .user-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
    .user-info { flex:1; min-width:0; }
    .user-name { font-weight:600; font-size:1rem; color:var(--text); }
    .user-username { font-size:0.8rem; color:var(--text-dim); }
    .user-meta { font-size:0.75rem; color:var(--text-dim); margin-top:4px; display:flex; gap:12px; flex-wrap:wrap; }
    .user-meta span { display:inline-flex; align-items:center; gap:4px; }
    .user-actions { display:flex; gap:6px; flex-shrink:0; }

    .section-title {
      font-size:0.75rem; font-weight:700; color:var(--text-dim);
      text-transform:uppercase; letter-spacing:1.5px; margin:24px 0 12px; padding-left:4px;
    }

    .trending-tags { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
    .trending-tag {
      padding:6px 14px; font-size:0.8rem; background:var(--surface);
      border:1px solid var(--border); border-radius:20px; color:var(--text-dim); cursor:pointer;
      transition:all 0.15s;
    }
    .trending-tag:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-glow); }

    .empty-search { text-align:center; padding:60px 20px; color:var(--text-dim); }
    .empty-search .icon { font-size:3rem; margin-bottom:12px; }

    @media(max-width:768px) {
      .search-box { flex-direction:column; }
      .user-card { flex-wrap:wrap; }
      .user-actions { width:100%; justify-content:flex-end; }
    }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2 style="color:var(--accent); font-size:1.4rem;">🔍 Find People</h2>
      <div style="display:flex;gap:8px;">
        <a href="friends.html" class="btn btn-ghost btn-sm">👥 Friends & Groups</a>
        <a href="dm.html" class="btn btn-ghost btn-sm">💬 Messages</a>
      </div>
    </div>

    <div class="search-container">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search by username or display name..." autofocus autocomplete="off" onkeydown="if(event.key==='Enter')searchPeople()">
        <button class="btn btn-primary" onclick="searchPeople()">🔍 Search</button>
      </div>

      <div id="trendingSection">
        <div class="section-title">🔥 Active Members</div>
        <div id="activeMembers"><div style="color:var(--text-dim);padding:10px;">Loading...</div></div>
      </div>

      <div id="searchResults" style="display:none;">
        <div class="section-title" id="resultsTitle">Search Results</div>
        <div id="resultsList"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    let currentUser = null;

    (async function init() {
      const user = await window.requireAuth();
      if (!user) return;
      currentUser = user;
      await loadActiveMembers();
    })();

    async function loadActiveMembers() {
      const { data } = await window.sb
        .from('user_profiles')
        .select('user_id, username, display_name, avatar_url, reputation_score, is_verified, is_admin, rank')
        .eq('is_suspended', false)
        .order('reputation_score', { ascending: false })
        .limit(12);

      const members = (data || []).filter(u => u.user_id !== currentUser.id);
      const container = document.getElementById('activeMembers');

      if (members.length === 0) {
        container.innerHTML = '<div style="color:var(--text-dim);padding:10px;">No other members yet.</div>';
        return;
      }

      container.innerHTML = members.map(u => renderUserCard(u)).join('');
    }

    async function searchPeople() {
      const term = document.getElementById('searchInput').value.trim();
      if (term.length < 2) {
        document.getElementById('searchResults').style.display = 'none';
        document.getElementById('trendingSection').style.display = '';
        return;
      }

      document.getElementById('trendingSection').style.display = 'none';
      document.getElementById('searchResults').style.display = '';

      const { data } = await window.sb
        .from('user_profiles')
        .select('user_id, username, display_name, avatar_url, reputation_score, is_verified, is_admin, rank, created_at')
        .or(`username.ilike.%${term}%,display_name.ilike.%${term}%`)
        .neq('user_id', currentUser.id)
        .limit(20);

      const results = data || [];
      document.getElementById('resultsTitle').textContent = `Search Results (${results.length})`;

      if (results.length === 0) {
        document.getElementById('resultsList').innerHTML = '<div class="empty-search"><div class="icon">🔍</div><p>No members found matching "' + escapeHtml(term) + '"</p></div>';
        return;
      }

      document.getElementById('resultsList').innerHTML = results.map(u => renderUserCard(u)).join('');
    }

    function renderUserCard(u) {
      const name = u.display_name || u.username || 'Member';
      const initial = name.charAt(0).toUpperCase();
      const rep = u.reputation_score ? (u.reputation_score / 10).toFixed(1) : '0.0';
      const verified = u.is_verified ? ' <span title="Verified" style="color:#10b981;">✅</span>' : '';
      const admin = u.is_admin ? ' <span title="Guildmaster" style="color:var(--accent);">👑</span>' : '';
      const rank = u.rank ? '<span class="rank-badge rank-' + u.rank + '" style="font-size:0.65rem;padding:2px 6px;margin-left:4px;">' + u.rank + '</span>' : '';
      const avatarHtml = u.avatar_url
        ? '<div class="user-avatar"><img src="' + u.avatar_url + '" alt=""></div>'
        : '<div class="user-avatar">' + initial + '</div>';

      return `
        <div class="user-card" onclick="window.location.href='profile.html?username=${escapeHtml(u.username)}'">
          ${avatarHtml}
          <div class="user-info">
            <div class="user-name">${escapeHtml(name)}${verified}${admin}${rank}</div>
            <div class="user-username">@${escapeHtml(u.username || '—')}</div>
            <div class="user-meta">
              <span>⭐ ${rep} rep</span>
              ${u.is_verified ? '<span style="color:#10b981;">✅ Verified</span>' : ''}
            </div>
          </div>
          <div class="user-actions">
            <button class="btn btn-outline btn-xs" onclick="event.stopPropagation();startDm('${u.user_id}')">💬 DM</button>
            <a href="profile.html?username=${escapeHtml(u.username)}" class="btn btn-ghost btn-xs" onclick="event.stopPropagation();">View</a>
          </div>
        </div>`;
    }

    window.startDm = async function(userId) {
      try {
        const { data: convId, error } = await window.sb.rpc('get_or_create_dm', { p_other_user_id: userId });
        if (error) {
          if (error.message && error.message.includes('does not exist')) {
            window.showToast('Messaging system not set up yet.', 'warning');
          } else {
            window.showToast('Failed: ' + error.message, 'error');
          }
          return;
        }
        window.location.href = 'dm.html';
      } catch (err) {
        window.showToast('Messaging not available.', 'warning');
      }
    };

    // Live search as you type
    let searchDebounce = null;
    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(searchPeople, 400);
    });
  </script>
  <script src="site-nav.js"></script>
</body>
</html>
