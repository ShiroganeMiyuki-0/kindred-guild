<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindred Guild — Edit Quest</title>
  <style>
    :root {
      --bg: #09090c;
      --surface: #12121a;
      --surface-2: #1e1e2c;
      --text: #e1e1e9;
      --text-dim: #8b8b9c;
      --accent: #c9a84c;
      --border: #222230;
      --success: #10b981;
      --error: #ef4444;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      padding: 40px 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--surface);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    h1 { color: var(--accent); margin-bottom: 12px; font-family: 'Cinzel', 'Georgia', serif; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: var(--text-dim); text-transform: uppercase; font-size: 0.85rem; }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-right: 10px;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-danger { background: var(--error); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .message { padding: 10px; border-radius: 8px; margin-bottom: 20px; display: none; }
    .message.success { display: block; background: rgba(16, 185, 129, 0.1); color: var(--success); }
    .message.error { display: block; background: rgba(239, 68, 68, 0.1); color: var(--error); }
  </style>
</head>
<body>
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1>Edit Quest Parameters</h1>
      <button class="btn btn-outline" style="padding: 6px 12px;" onclick="history.back()">← Back</button>
    </div>
    <p style="color: var(--text-dim); margin-bottom: 20px;">Refine your task description, adjust Economic Settlement Modes, or dynamically alter reward appraisal values while changes are still reversible.</p>
    <div id="editMessage" class="message"></div>
    <div id="editForm">
      <div class="form-group">
        <label>Quest Title</label>
        <input type="text" id="editTitle">
      </div>
      <div class="form-group">
        <label>Quest Parameters / Description</label>
        <textarea id="editDescription" rows="5"></textarea>
      </div>
      <div class="form-group">
        <label>Economic Settlement Mode</label>
        <select id="editPaymentType" onchange="handlePaymentTypeChange()">
          <option value="coins">🪙 Fairy Coins</option>
          <option value="upi">₹ UPI Direct</option>
          <option value="free">🎁 Free Goodwill</option>
        </select>
      </div>
      <div class="form-group">
        <label>Category / Hashtag Tags (comma separated)</label>
        <input type="text" id="editTags">
      </div>
      <div class="form-group" id="coinInputGroup">
        <label>Appraised Fairy Coins Reward (Adjust value to edit payouts)</label>
        <input type="number" id="editCoinAmount">
      </div>
      <div class="form-group" id="upiInputGroup">
        <label>Appraised UPI Reward (₹)</label>
        <input type="number" id="editUpiAmount">
      </div>
      <div style="margin-top: 30px; display: flex; gap: 10px; flex-wrap: wrap;">
        <button id="saveEditBtn" class="btn btn-primary" onclick="saveQuestChanges()">Save Changes</button>
        <button id="cancelQuestBtn" class="btn btn-danger" onclick="cancelQuest()">Forfeit & Cancel Quest</button>
        <a href="quest-board.html" class="btn btn-outline" style="text-decoration: none; text-align: center; line-height: 24px;">Discard</a>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="quest-edit.js"></script>
</body>
</html>
