<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindred Guild — Choose Your Name</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
  <link rel="stylesheet" href="css/globals.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;    /* Stacks navbar cleanly on top */
      align-items: center;        /* Centers card horizontally */
      justify-content: center;    /* Centers card vertically */
      padding: 20px;
    }
    
    .setup-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      margin: 40px auto;          /* Provides breathing room from nav bar */
    }
    .logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo h1 {
      font-size: 1.5rem;
      color: var(--accent);
    }
    .logo p {
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="setup-card">
    <div class="logo">
      <h1>⚔️ Welcome to the Guild</h1>
      <p>Pick a username to get started</p>
    </div>
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="e.g. moonweaver" autocomplete="off">
      <p style="font-size:0.75rem;color:var(--text-muted);margin-top:4px">Letters, numbers, underscores. At least 3 characters.</p>
    </div>
    <div class="form-group">
      <label for="displayName">Display Name (optional)</label>
      <input type="text" id="displayName" placeholder="e.g. Aria Moonweaver">
    </div>
    <button id="createBtn" class="btn btn-primary" style="width:100%;padding:14px" onclick="createProfile()">Join the Guild</button>
    <div id="message" class="message"></div>
  </div>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="username-setup.js"></script>
  <script src="site-nav.js"></script>
</body>
</html>
