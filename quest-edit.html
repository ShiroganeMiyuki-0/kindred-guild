  <style>
    .container { max-width:600px; margin:0 auto; padding:20px; }
    .card { padding:28px; }
    h1 { color:var(--accent); margin-bottom:8px; font-size:1.4rem; }
    .subtitle { color:var(--text-dim); margin-bottom:20px; font-size:0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>✏️ Edit Quest</h1>
    <p class="subtitle">Change the name, type, tags, or reward. Changes are saved immediately.</p>
    <div id="editMessage" class="message"></div>
    <div class="card">
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="editTitle">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="editDescription" rows="5"></textarea>
      </div>
      <div class="form-group">
        <label>Payment Type</label>
        <select id="editPaymentType" onchange="handlePaymentTypeChange()">
          <option value="coins">🪙 Fairy Coins</option>
          <option value="upi">₹ UPI Direct</option>
          <option value="free">🎁 Free</option>
        </select>
      </div>
      <div class="form-group">
        <label>Tags (comma separated)</label>
        <input type="text" id="editTags">
      </div>
      <div class="form-group" id="coinInputGroup">
        <label>Fairy Coins Reward</label>
        <input type="number" id="editCoinAmount">
      </div>
      <div class="form-group" id="upiInputGroup">
        <label>UPI Reward (₹)</label>
        <input type="number" id="editUpiAmount">
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:20px">
        <button id="saveEditBtn" class="btn btn-primary" onclick="saveQuestChanges()">Save Changes</button>
        <button id="cancelQuestBtn" class="btn btn-error" onclick="cancelQuest()">Cancel & Refund</button>
        <a href="quest-board.html" class="btn btn-ghost">Back to Board</a>
      </div>
    </div>
  </div>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="quest-edit.js"></script>
  <script src="site-nav.js"></script>
</body>
