  <style>
    .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:12px; }
    .page-header h2 { color:var(--accent); font-size:1.4rem; }
    .sort-tabs { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
    .sort-tab { padding:6px 14px; font-size:0.8rem; background:var(--surface); border:1px solid var(--border); border-radius:20px; color:var(--text-dim); cursor:pointer; }
    .sort-tab.active { border-color:var(--accent); background:var(--accent-glow); color:var(--accent); }
    .leaderboard-list { display:flex; flex-direction:column; gap:8px; }
    .lb-row { display:flex; align-items:center; gap:14px; padding:14px 18px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); transition:all 0.15s; }
    .lb-row:hover { border-color:var(--accent); }
    .lb-row.top-3 { border-color:rgba(212,175,55,0.3); background:linear-gradient(135deg,rgba(212,175,55,0.04),var(--surface)); }
    .lb-rank { font-size:1.2rem; font-weight:800; color:var(--text-dim); min-width:36px; text-align:center; }
    .lb-row.top-3 .lb-rank { color:var(--accent); }
    .lb-avatar { width:40px; height:40px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--accent); font-size:1rem; border:2px solid var(--border); }
    .lb-row.top-3 .lb-avatar { border-color:var(--accent); }
    .lb-info { flex:1; min-width:0; }
    .lb-name { font-weight:600; font-size:0.95rem; color:var(--text); }
    .lb-name a { color:inherit; text-decoration:none; }
    .lb-name a:hover { color:var(--accent); }
    .lb-username { font-size:0.75rem; color:var(--text-dim); }
    .lb-stats { display:flex; gap:16px; flex-wrap:wrap; }
    .lb-stat { text-align:center; }
    .lb-stat-val { font-size:0.95rem; font-weight:700; color:var(--accent); }
    .lb-stat-label { font-size:0.65rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; }
    @media(max-width:768px) { .lb-stats { gap:10px; } .lb-stat-val { font-size:0.85rem; } }
    .medal { font-size:1.1rem; }
    .empty-state { text-align:center; padding:40px; color:var(--text-dim); }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h2>🏆 Leaderboard</h2>
      <div style="display:flex;gap:8px;">
        <a href="quest-board.html" class="btn btn-ghost btn-sm">← Quest Board</a>
      </div>
    </div>

    <div class="sort-tabs">
      <span class="sort-tab active" data-sort="reputation" onclick="sortLeaderboard('reputation')">⭐ Reputation</span>
      <span class="sort-tab" data-sort="completed" onclick="sortLeaderboard('completed')">✅ Completed</span>
      <span class="sort-tab" data-sort="earned" onclick="sortLeaderboard('earned')">💰 Earned</span>
      <span class="sort-tab" data-sort="posted" onclick="sortLeaderboard('posted')">📝 Posted</span>
      <span class="sort-tab" data-sort="active" onclick="sortLeaderboard('active')">🔥 Most Active</span>
    </div>

    <div class="leaderboard-list" id="leaderboardList">
      <div class="empty-state">Loading leaderboard...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    let leaderboardData = [];
    let currentSort = 'reputation';

    (async function init() {
      await window.requireAuth();
      await loadLeaderboard();
    })();

    async function loadLeaderboard() {
      const { data, error } = await window.sb.rpc('get_leaderboard', { p_limit: 50 });
      if (error) {
        // Fallback: query user_profiles directly
        const { data: users } = await window.sb.from('user_profiles').select('user_id, username, display_name, reputation_score, avatar_url, created_at, rank, is_admin').eq('is_suspended', false).order('reputation_score', { ascending: false }).limit(50);
        leaderboardData = (users || []).map((u, i) => ({
          ...u,
          quests_completed: 0,
          quests_posted: 0,
          wishes_backed: 0,
          guild_messages: 0,
          total_earned: 0
        }));
      } else {
        leaderboardData = data || [];
      }
      renderLeaderboard();
    }

    function sortLeaderboard(sort) {
      currentSort = sort;
      document.querySelectorAll('.sort-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-sort="${sort}"]`).classList.add('active');
      renderLeaderboard();
    }

    function renderLeaderboard() {
      const sorted = [...leaderboardData];
      const sortFns = {
        reputation: (a, b) => b.reputation_score - a.reputation_score || b.quests_completed - a.quests_completed,
        completed: (a, b) => b.quests_completed - a.quests_completed,
        earned: (a, b) => b.total_earned - a.total_earned,
        posted: (a, b) => b.quests_posted - a.quests_posted,
        active: (a, b) => (b.quests_completed + b.wishes_backed + b.guild_messages) - (a.quests_completed + a.wishes_backed + a.guild_messages)
      };
      sorted.sort(sortFns[currentSort] || sortFns.reputation);

      const container = document.getElementById('leaderboardList');
      if (sorted.length === 0) {
        container.innerHTML = '<div class="empty-state">No guild members yet.</div>';
        return;
      }

      const medals = ['🥇', '🥈', '🥉'];
      container.innerHTML = sorted.map((u, i) => {
        const rank = i + 1;
        const isTop3 = rank <= 3;
        const name = u.display_name || u.username || 'Member';
        const rep = u.reputation_score ? (u.reputation_score / 10).toFixed(1) : '0.0';
        const initial = name.charAt(0).toUpperCase();
        const totalActive = (u.quests_completed || 0) + (u.wishes_backed || 0) + (u.guild_messages || 0);
        const verified = u.is_verified ? ' <span title="Verified Worker" style="color:#10b981;">✅</span>' : '';

        return `
          <div class="lb-row ${isTop3 ? 'top-3' : ''}">
            <div class="lb-rank">${isTop3 ? '<span class="medal">' + medals[rank - 1] + '</span>' : rank}</div>
            <div class="lb-avatar">${initial}</div>
            <div class="lb-info">
              <div class="lb-name">${u.is_admin ? '<span style="background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000;padding:2px 8px;border-radius:4px;font-weight:900;font-size:0.65rem;margin-right:4px;">👑 GM</span>' : (u.rank ? '<span class="rank-badge rank-' + u.rank + '" style="width:20px;height:20px;font-size:0.65rem;margin-right:4px;">' + u.rank + '</span>' : '')}<a href="profile.html?username=${escapeHtml(u.username)}">${escapeHtml(name)}</a>${verified}</div>
              <div class="lb-username">@${escapeHtml(u.username || '—')}</div>
            </div>
            <div class="lb-stats">
              <div class="lb-stat"><div class="lb-stat-val">${rep}</div><div class="lb-stat-label">Rep</div></div>
              <div class="lb-stat"><div class="lb-stat-val">${u.quests_completed || 0}</div><div class="lb-stat-label">Done</div></div>
              <div class="lb-stat"><div class="lb-stat-val">${u.total_earned || 0}</div><div class="lb-stat-label">FC</div></div>
              <div class="lb-stat"><div class="lb-stat-val">${u.quests_posted || 0}</div><div class="lb-stat-label">Posted</div></div>
              <div class="lb-stat"><div class="lb-stat-val">${totalActive}</div><div class="lb-stat-label">Active</div></div>
            </div>
          </div>`;
      }).join('');
    }
  </script>
  <script src="site-nav.js"></script>
</body>
