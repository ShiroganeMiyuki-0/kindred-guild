<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kindred Guild — Enter the Guild</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface-2: #252530;
      --text: #e8e8f0;
      --text-dim: #9090a0;
      --accent: #c9a84c;
      --accent-glow: rgba(201, 168, 76, 0.2);
      --error: #e74c3c;
      --success: #2ecc71;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--surface-2);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo h1 {
      font-size: 1.8rem;
      color: var(--accent);
      letter-spacing: 1px;
    }
    .logo p {
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-top: 6px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg);
      border: 1px solid var(--surface-2);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    button {
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: #0f0f13;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); opacity: 0.9; }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .google-btn {
      background: #fff;
      color: #333;
    }
    .google-btn:hover {
      background: #f5f5f5;
    }
    .divider {
      text-align: center;
      margin: 24px 0;
      color: var(--text-dim);
      font-size: 0.8rem;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 35%;
      height: 1px;
      background: var(--surface-2);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    .message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    .message.error { background: rgba(231, 76, 60, 0.15); color: var(--error); display: block; }
    .message.success { background: rgba(46, 204, 113, 0.15); color: var(--success); display: block; }
    .message.info { background: rgba(201, 168, 76, 0.15); color: var(--accent); display: block; }
    .hidden { display: none !important; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--text-dim);
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
    }
    .back-link:hover { color: var(--accent); }
    .email-display {
      text-align: center;
      color: var(--text-dim);
      margin-bottom: 16px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo">
      <h1>⚔️ Kindred Guild</h1>
      <p>What goes comes back</p>
    </div>

    <!-- Step 1: Choose login method -->
    <div id="methodStep">
      <button class="google-btn" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.18-1.84H9v3.49h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.92a8.78 8.78 0 0 0 2.68-6.62z"/><path fill="#34A853" d="M9 18a8.62 8.62 0 0 0 6-2.18l-2.92-2.26a5.43 5.43 0 0 1-8.08-2.85H1.45v2.34A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M4 10.71a5.36 5.36 0 0 1 0-3.42V4.95H1.45a9 9 0 0 0 0 8.1L4 10.71z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A8.9 8.9 0 0 0 9 0a9 9 0 0 0-7.55 4.14L4 6.48a5.36 5.36 0 0 1 5-2.9z"/></svg>
        Sign in with Google
      </button>

      <div class="divider">or</div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <button id="sendOtpBtn" onclick="sendOTP()">Send Magic Link</button>
    </div>

    <!-- Step 2: Check email -->
    <div id="emailStep" class="hidden">
      <div class="email-display" id="emailDisplay"></div>
      <div class="divider">Check your inbox</div>
      <p style="color: var(--text-dim); text-align: center; margin: 20px 0; line-height: 1.6;">
        We sent a magic link to your email.<br>
        Click the link in your email to enter the guild.<br><br>
        <span style="font-size: 0.85rem;">Didn't receive it? Check your spam folder.</span>
      </p>
      <button onclick="backToMethods()">Use a different method</button>
    </div>

    <div id="message" class="message"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
</body>
</html>
