  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;    /* Stacks navbar cleanly on top */
      align-items: center;        /* Centers card horizontally */
      justify-content: center;    /* Centers card vertically */
      padding: 20px;
    }
    
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      margin: 40px auto;          /* Provides breathing room from nav bar */
    }
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo h1 {
      font-size: 1.6rem;
      color: var(--accent);
      letter-spacing: 1px;
    }
    .logo p {
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .check-email {
      text-align: center;
      color: var(--text-dim);
      margin: 16px 0;
      line-height: 1.6;
    }
    .check-email strong { color: var(--text); }
    .email-display {
      text-align: center;
      color: var(--text-dim);
      margin-bottom: 12px;
      font-size: 0.9rem;
      word-break: break-all;
    }
    .trust-note {
      text-align: center;
      margin-top: 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .trust-note a { color: var(--accent); }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <div class="auth-card">
    <div class="logo">
      <h1>⚔️ Kindred Guild</h1>
      <p>Help your community, earn trust</p>
    </div>

    <div id="emailStep">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" onkeydown="if(event.key==='Enter')sendMagicLink()">
      </div>
      <div class="form-group">
        <label for="referralCode">Referral Code (optional)</label>
        <input type="text" id="referralCode" placeholder="e.g. A1B2C3D4" maxlength="8" style="text-transform:uppercase">
      </div>
      <button id="sendBtn" class="btn btn-primary" style="width:100%;padding:14px" onclick="sendMagicLink()">Send Magic Link</button>
      <p class="trust-note">We'll send a login link to your email. No password needed.<br><a href="terms-of-service.html">Terms</a> · <a href="privacy-policy.html">Privacy</a></p>
    </div>

    <div id="checkStep" class="hidden">
      <div class="email-display" id="emailDisplay"></div>
      <div class="check-email">
        Check your email for a login link.<br>
        <strong>Click the link</strong> to enter the guild.<br><br>
        <span style="font-size:0.85rem;color:var(--text-muted)">Didn't get it? Check spam, or try again.</span>
      </div>
      <button class="btn btn-ghost" style="width:100%" onclick="backToEmail()">Use a different email</button>
    </div>

    <div id="message" class="message"></div>
  </div>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="auth.js"></script>
  <script src="welcome-email.js"></script>
  <script src="site-nav.js"></script>
</body>
</html>
