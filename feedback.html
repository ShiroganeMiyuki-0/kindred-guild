<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kindred Guild — Guild Feedback</title>
  <meta name="description" content="Send suggestions, report bugs, or share your thoughts with the Kindred Guild Master.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
  <link rel="stylesheet" href="css/globals.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <style>
    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --accent: #e2b714;
      --text: #e0e0e0;
      --muted: #a0a0b0;
      --success: #4caf50;
      --danger: #f44336;
      --border: #2a2a40;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    
    .container {
      max-width: 550px;
      width: 100%;
      background: var(--card);
      border-radius: 16px;
      padding: 32px;
      border: 1px solid var(--border);
      margin: 40px 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: var(--accent);
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: 600;
    }
    
    select, input, textarea {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 20px;
      outline: none;
      font-family: inherit;
    }
    
    select:focus, input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(226, 183, 20, 0.1);
    }
    
    textarea {
      resize: vertical;
      min-height: 140px;
    }
    
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: var(--accent);
      color: #000;
    }
    .btn-primary:hover {
      background: #f0c420;
      transform: translateY(-1px);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }
    
    .status-alert {
      display: none;
      padding: 16px;
      border-radius: 10px;
      margin-top: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      text-align: center;
    }
    .status-alert.success {
      display: block;
      background: rgba(76, 175, 80, 0.15);
      border: 1px solid var(--success);
      color: var(--success);
    }
    .status-alert.error {
      display: block;
      background: rgba(244, 67, 54, 0.15);
      border: 1px solid var(--danger);
      color: var(--danger);
    }
    
    .guild-note {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      margin-top: 24px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📝 Send Feedback to the Guild</h1>
    <p class="subtitle">Spotted a bug? Have a great feature idea? Share it directly with the Guild Master!</p>

    <form id="feedbackForm" onsubmit="handleFeedbackSubmit(event)">
      <!-- Category Selection -->
      <label for="feedbackCategory">Type of Feedback</label>
      <select id="feedbackCategory" required>
        <option value="" disabled selected>Choose a category...</option>
        <option value="Bug">🪲 Report a Bug / Issue</option>
        <option value="Feature Request">💡 Suggest a Feature</option>
        <option value="Appreciation">💖 Share Guild Love / Praise</option>
        <option value="Inquiry">❓ General Inquiry</option>
      </select>

      <!-- Email Input (Filled automatically if logged in) -->
      <label for="feedbackEmail">Your Email Address</label>
      <input type="email" id="feedbackEmail" placeholder="e.g. adventurer@gmail.com" required />

      <!-- Subject Input -->
      <label for="feedbackSubject">Subject</label>
      <input type="text" id="feedbackSubject" placeholder="e.g. Quest Board UI glitch on mobile" required />

      <!-- Message Text -->
      <label for="feedbackMessage">Your Message</label>
      <textarea id="feedbackMessage" placeholder="Describe your suggestion or bug in detail..." required></textarea>

      <!-- Submit button -->
      <button class="btn btn-primary" type="submit" id="submitFeedbackBtn">
        ✨ Submit Feedback
      </button>
    </form>

    <div id="statusAlert" class="status-alert"></div>
    
    <p class="guild-note">
      Kindred Guild is shaped and built by its community. Thank you for making our world a better place to connect!
    </p>
  </div>

  <script>
    let activeUserId = null;

    // Detect logged-in user to fill their email address
    async function loadUserData() {
      if (window.supabase) {
        try {
          const { data: { session } } = await window.supabase.auth.getSession();
          if (session && session.user) {
            activeUserId = session.user.id;
            const emailInput = document.getElementById('feedbackEmail');
            emailInput.value = session.user.email;
            // Make email readonly for logged-in users to keep submissions reliable
            emailInput.setAttribute('readonly', 'true');
            emailInput.style.opacity = '0.7';
          }
        } catch (err) {
          console.warn("Failed to retrieve user session details for prefill:", err);
        }
      }
    }

    // Handle feedback form submission
    async function handleFeedbackSubmit(event) {
      event.preventDefault();
      
      const category = document.getElementById('feedbackCategory').value;
      const email = document.getElementById('feedbackEmail').value;
      const subject = document.getElementById('feedbackSubject').value;
      const message = document.getElementById('feedbackMessage').value;
      
      const submitBtn = document.getElementById('submitFeedbackBtn');
      const alertBox = document.getElementById('statusAlert');
      
      // Update UI state to loading
      submitBtn.disabled = true;
      submitBtn.innerText = '✨ Submitting to Guild Master...';
      alertBox.className = 'status-alert';
      alertBox.style.display = 'none';

      if (!window.supabase) {
        showError("Database client not found. Please verify your Supabase configuration.");
        submitBtn.disabled = false;
        submitBtn.innerText = '✨ Submit Feedback';
        return;
      }

      try {
        const { error } = await window.supabase
          .from('feedback')
          .insert([
            {
              user_id: activeUserId,
              email: email,
              category: category,
              subject: subject,
              message: message
            }
          ]);

        if (error) throw error;

        // Success state
        alertBox.className = 'status-alert success';
        alertBox.innerHTML = `🎉 <strong>Feedback Submitted!</strong> Your message has been sent to the Guild Master. Thank you for your support, adventurer!`;
        alertBox.style.display = 'block';
        
        // Reset form inputs
        document.getElementById('feedbackSubject').value = '';
        document.getElementById('feedbackMessage').value = '';
        document.getElementById('feedbackCategory').value = '';

      } catch (err) {
        console.error("Feedback submit error:", err);
        showError(`Failed to save feedback: ${err.message}. Please verify if the 'feedback' database schema was successfully created.`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '✨ Submit Feedback';
      }
    }

    function showError(text) {
      const alertBox = document.getElementById('statusAlert');
      alertBox.className = 'status-alert error';
      alertBox.innerHTML = `⚠️ <strong>Error:</strong> ${text}`;
      alertBox.style.display = 'block';
    }

    // Run on startup
    window.addEventListener('load', () => {
      // Allow short delay for Supabase to instantiate
      setTimeout(loadUserData, 200);
    });
  </script>
  <script src="site-nav.js"></script>
</body>
</html>
