<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindred Guild — Quest Board</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface-2: #252530;
      --text: #e8e8f0;
      --text-dim: #9090a0;
      --accent: #c9a84c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--surface-2);
    }
    .header h1 {
      font-size: 1.5rem;
      color: var(--accent);
    }
    .header .actions {
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 12px 24px;
      background: var(--accent);
      color: #0f0f13;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { opacity: 0.9; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--surface-2);
      border-radius: 16px;
      padding: 48px;
      text-align: center;
    }
    .card h2 { color: var(--accent); margin-bottom: 16px; }
    .card p { color: var(--text-dim); line-height: 1.6; margin-bottom: 24px; }
    .logout {
      position: absolute;
      top: 20px;
      right: 20px;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.9rem;
    }
    .logout:hover { color: var(--accent); }
    .user-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .user-bar .name { font-weight: 600; }
    .user-bar .coins { font-size: 0.85rem; color: var(--text-dim); }
    .user-bar .coins span { color: var(--accent); }
  </style>
</head>
<body>
  <span class="logout" onclick="logout()">Logout</span>
  
  <div class="container">
    <div class="header">
      <h1>⚔️ Quest Board</h1>
      <div class="actions">
        <a href="quest-post.html" class="btn">+ Post a Quest</a>
      </div>
    </div>

    <div class="user-bar" id="userBar">
      <div class="name" id="userName">Loading...</div>
      <div class="coins">💰 <span id="coinBalance">--</span> Fairy Coins</div>
    </div>

    <div class="card">
      <h2>Quest Board Coming Soon</h2>
      <p>The quest board is being built right now. You can already post quests though!</p>
      <a href="quest-post.html" class="btn">Post Your First Quest</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = window.supabase.createClient(
      'https://owpyqeubmfvtuqjaxauo.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93cHlxZXVibWZ2dHVxamF4YXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MTYxODQsImV4cCI6MjA5NTI5MjE4NH0.9lQ8jxTgiCdhjC8VeYAuU3EI7UzvwHiwuGIuwyxMGLM'
    );

    async function loadUser() {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) {
        window.location.href = 'auth.html';
        return;
      }
      const { data: profile } = await sb
        .from('user_profiles')
        .select('username, display_name')
        .eq('user_id', user.id)
        .single();

      const name = profile?.display_name || profile?.username || 'Guild Member';
      document.getElementById('userName').textContent = 'Welcome, ' + name;

      const { data: balance } = await sb.rpc('get_coin_balance', { p_user_id: user.id });
      document.getElementById('coinBalance').textContent = balance || 0;
    }

    async function logout() {
      await sb.auth.signOut();
      window.location.href = 'auth.html';
    }

    loadUser();
  </script>
</body>
</html>
