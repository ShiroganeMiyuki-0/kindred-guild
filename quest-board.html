<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindred Guild — Quest Board</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface-2: #252530;
      --text: #e8e8f0;
      --text-dim: #9090a0;
      --accent: #c9a84c;
      --accent-glow: rgba(201, 168, 76, 0.2);
      --error: #e74c3c;
      --success: #2ecc71;
      --free: #2ecc71;
      --coins: #f1c40f;
      --upi: #e67e22;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--surface-2);
      flex-wrap: wrap;
      gap: 12px;
    }
    .header h1 {
      font-size: 1.5rem;
      color: var(--accent);
    }
    .header .actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn {
      padding: 10px 20px;
      background: var(--accent);
      color: #0f0f13;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { opacity: 0.9; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .user-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .user-bar .name { font-weight: 600; }
    .user-bar .coins {
      font-size: 0.85rem;
      color: var(--text-dim);
      background: var(--surface);
      padding: 6px 14px;
      border-radius: 20px;
    }
    .user-bar .coins span { color: var(--accent); font-weight: 600; }

    .filters {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .filters select, .filters button {
      padding: 10px 16px;
      background: var(--surface);
      border: 1px solid var(--surface-2);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
    }
    .filters button {
      background: var(--accent);
      color: #0f0f13;
      border: none;
      font-weight: 600;
    }

    .quest-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .quest-card {
      background: var(--surface);
      border: 1px solid var(--surface-2);
      border-radius: 16px;
      padding: 24px;
      transition: border-color 0.2s, transform 0.15s;
    }
    .quest-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .quest-card .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .badge-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .badge-row .badge { margin-bottom: 0; }
    .badge-coins { background: rgba(241, 196, 15, 0.15); color: var(--coins); }
    .badge-upi { background: rgba(230, 126, 34, 0.15); color: var(--upi); }
    .badge-free { background: rgba(46, 204, 113, 0.15); color: var(--free); }
    .badge-status-open { background: rgba(52, 152, 219, 0.15); color: #3498db; }
    .badge-status-accepted { background: rgba(155, 89, 182, 0.15); color: #9b59b6; }
    .badge-status-submitted { background: rgba(241, 196, 15, 0.15); color: #f1c40f; }
    .badge-status-disputed { background: rgba(231, 76, 60, 0.15); color: #e74c3c; }
    .quest-card h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .quest-card .poster {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 12px;
    }
    .quest-card .poster span { color: var(--accent); }
    .quest-card .description {
      font-size: 0.9rem;
      color: var(--text-dim);
      line-height: 1.5;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .quest-card .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.85rem;
    }
    .quest-card .reward {
      font-weight: 700;
      color: var(--accent);
    }
    .quest-card .deadline {
      color: var(--text-dim);
    }
    .quest-card .accept-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #0f0f13;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .quest-card .accept-btn:hover { opacity: 0.9; }
    .quest-card .accept-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .quest-card .accept-btn.own {
      background: var(--surface-2);
      color: var(--text-dim);
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }
    .empty-state h2 { color: var(--accent); margin-bottom: 12px; }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--surface-2);
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
    }
    .modal h3 { color: var(--accent); margin-bottom: 16px; }
    .modal p { color: var(--text-dim); line-height: 1.6; margin-bottom: 24px; }
    .modal-buttons { display: flex; gap: 12px; }
    .modal-buttons button {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .modal-buttons .confirm { background: var(--accent); color: #0f0f13; }
    .modal-buttons .cancel { background: var(--surface-2); color: var(--text); }
    .logout { color: var(--text-dim); cursor: pointer; font-size: 0.9rem; }
    .logout:hover { color: var(--accent); }

    /* Modern Date Styles */
    .modern-date {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .date-main {
      font-weight: 600;
      color: var(--text);
      font-size: 0.9rem;
    }
    .date-sub {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 2px;
    }
    .date-relative {
      color: var(--accent);
      font-weight: 600;
    }
    .date-expired {
      color: var(--error);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚔️ Quest Board</h1>
      <div class="actions">
        <span class="logout" onclick="logout()">Logout</span>
        <a href="quest-post.html" class="btn">+ Post Quest</a>
      </div>
    </div>

    <div class="user-bar" id="userBar">
      <div class="name" id="userName">Loading...</div>
      <div class="coins">💰 <span id="coinBalance">--</span> FC</div>
    </div>

    <div class="filters">
      <select id="filterType" onchange="loadQuests()">
        <option value="all">All Types</option>
        <option value="coins">🪙 Fairy Coins</option>
        <option value="upi">₹ UPI Direct</option>
        <option value="free">🎁 Free</option>
      </select>
      <select id="sortBy" onchange="loadQuests()">
        <option value="newest">Newest First</option>
        <option value="deadline">Deadline Soonest</option>
        <option value="pay">Highest Pay</option>
      </select>
      <button onclick="loadQuests()">Refresh</button>
    </div>

    <div class="quest-grid" id="questGrid">
      <div class="empty-state">
        <h2>Loading quests...</h2>
      </div>
    </div>
  </div>

  <!-- Accept Modal -->
  <div class="modal-overlay" id="acceptModal">
    <div class="modal" id="modalContent">
      <h3>Accept Quest</h3>
      <p id="modalText">Are you sure?</p>
      <div class="modal-buttons">
        <button class="cancel" onclick="closeModal()">Cancel</button>
        <button class="confirm" onclick="confirmAccept()">Accept</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="quest-board.js"></script>
</body>
</html>
