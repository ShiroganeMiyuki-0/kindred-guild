  <style>
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }
    .page-header h1 {
      font-size: 1.5rem;
      color: var(--accent);
      letter-spacing: 1px;
    }
    .page-header .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .user-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: var(--radius);
      flex-wrap: wrap;
      gap: 10px;
    }
    .user-bar .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .user-bar .name-link {
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
    }
    .user-bar .name-link:hover { color: var(--accent); }
    .user-bar .coins {
      font-size: 0.85rem;
      color: var(--text-dim);
      background: var(--surface-2);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .user-bar .coins span { color: var(--accent); font-weight: 600; }

    .filters-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 20px;
    }
    .search-row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }
    .search-row input { flex: 1; }

    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--border);
    }
    .tag-badge {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text-dim);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
    }
    .tag-badge:hover, .tag-badge.active {
      background: var(--accent-glow);
      color: var(--accent);
      border-color: var(--accent);
    }

    .view-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      flex-wrap: wrap;
    }
    .view-tab {
      padding: 8px 14px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text-dim);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .view-tab.active {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .filters select {
      padding: 10px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
    }
    .filters select:focus {
      border-color: var(--accent);
      outline: none;
    }

    .quest-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .quest-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: border-color 0.2s, transform 0.15s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .quest-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .quest-body { margin-bottom: 14px; }
    .quest-card .badge { margin-bottom: 10px; }
    .status-badge { float: right; }
    .quest-card h3 { font-size: 1.05rem; margin-bottom: 6px; line-height: 1.3; }
    .quest-card .poster { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 10px; }
    .quest-card .poster a { color: var(--accent); }
    .quest-card .description {
      font-size: 0.85rem;
      color: var(--text-dim);
      line-height: 1.5;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .quest-card .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.85rem;
    }
    .quest-card .reward { font-weight: 700; color: var(--accent); }
    .quest-card .action-btn {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
      transition: opacity 0.2s;
    }
    .quest-card .action-btn:hover { opacity: 0.9; text-decoration: none; }
    .quest-card .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .quest-card .action-btn.own {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .quest-card .action-btn.own:hover { background: var(--accent-glow); opacity: 1; }

    .modern-date {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .date-main { font-weight: 600; color: var(--text); font-size: 0.85rem; }
    .date-sub { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }
    .date-relative { color: var(--accent); font-weight: 600; }
    .date-expired { color: var(--error); font-weight: 700; text-transform: uppercase; font-size: 0.7rem; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
      grid-column: 1 / -1;
    }
    .empty-state h2 { color: var(--accent); margin-bottom: 8px; font-size: 1.2rem; }
    .logout { color: var(--text-dim); cursor: pointer; font-size: 0.85rem; }
    .logout:hover { color: var(--accent); }
  </style>

<body>
  <div class="container">
    <div class="page-header">
      <h1>⚔️ Quest Board</h1>
      <div class="actions">
        <a href="index.html" class="btn btn-ghost btn-sm">🏠 Home</a>
        <button class="btn btn-ghost btn-sm" onclick="window.showOnboarding && window.showOnboarding(true)">🎮 Guide</button>
        <a href="fairy-wishes.html" class="btn btn-ghost btn-sm">✨ Wishes</a>
        <a href="worker-post.html" class="btn btn-ghost btn-sm">🛡️ Workers</a>
        <a href="undo-history.html" class="btn btn-ghost btn-sm">📜 History</a>
        <a href="coin_purchase_ui.html" class="btn btn-ghost btn-sm">💰 Buy Coins</a>
        <a href="donation.html" class="btn btn-ghost btn-sm">❤️ Support</a>
        <a href="guild-hall.html" class="btn btn-ghost btn-sm">🏰 Guild Hall</a>
        <a href="quest-post.html" class="btn btn-primary btn-sm">⚔️ Post Task</a>
        <span class="logout" onclick="logout()">Logout</span>
      </div>
    </div>

    <div class="user-bar" id="userBar">
      <div class="user-info">
        <a href="profile.html" class="name-link" id="userName">Loading...</a>
      </div>
      <div class="coins" id="coinBalanceContainer">💰 <span id="coinBalance">--</span> FC</div>
    </div>

    <div class="filters-section">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="🔍 Search tasks, tags..." oninput="handleSearch()">
      </div>
      <div class="tag-cloud" id="tagCloud"></div>
      <div class="view-selector">
        <button class="view-tab active" id="view-open" onclick="switchView('open')">Available</button>
        <button class="view-tab" id="view-active" onclick="switchView('my_active')">My Active</button>
        <button class="view-tab" id="view-posted" onclick="switchView('my_posted')">My Posted</button>
        <button class="view-tab" id="view-completed" onclick="switchView('my_completed')">Completed</button>
        <button class="view-tab" id="view-bookmarked" onclick="switchView('bookmarked')">🔖 Bookmarked</button>
      </div>
      <div class="filters">
        <select id="filterType" onchange="loadQuests()">
          <option value="all">All Types</option>
          <option value="coins">🪙 Fairy Coins</option>
          <option value="upi">₹ UPI Direct</option>
          <option value="free">🎁 Free</option>
        </select>
        <select id="sortBy" onchange="loadQuests()">
          <option value="newest">Newest</option>
          <option value="deadline">Deadline Soonest</option>
          <option value="pay">Highest Pay</option>
        </select>
        <button class="btn btn-ghost btn-sm" onclick="resetFilters()">Clear</button>
        <button class="btn btn-ghost btn-sm" onclick="loadQuests()">Refresh</button>
      </div>
    </div>

    <div class="quest-grid" id="questGrid">
      <div class="empty-state"><h2>Loading...</h2></div>
    </div>
  </div>
