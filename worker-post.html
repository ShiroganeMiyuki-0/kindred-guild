  <style>
    .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
    .page-header h1 { font-size:1.4rem; color:var(--accent); }
    .post-form { background:var(--surface); padding:20px; border-radius:var(--radius); border:1px solid var(--border); margin-bottom:28px; }
    .post-form h3 { color:var(--accent); margin-bottom:6px; }
    .post-form>p { color:var(--text-dim); margin-bottom:14px; font-size:0.85rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
    #workerMessage { margin-bottom:12px; }

<meta property="og:title" content="Kindred Guild — Be a Worker">
  <meta property="og:description" content="Post your availability and skills. Get hired by community members.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Kindred Guild">
  <link rel="manifest" href="manifest.json">
  <link rel="canonical" href="https://kindredguild.org/worker-post.html">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>🛡️ Adventurers for Hire</h1>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <a href="index.html" class="btn btn-ghost btn-sm">🏠 Home</a>
        <a href="coin_purchase_ui.html" class="btn btn-ghost btn-sm">💰 Buy Coins</a>
        <a href="donation.html" class="btn btn-ghost btn-sm">❤️ Support</a>
        <a href="dm.html" class="btn btn-ghost btn-sm">💬 Messages</a>
        <a href="quest-board.html" class="btn btn-ghost btn-sm">← Board</a>
        <span style="font-size:0.85rem;color:var(--text-dim)">Welcome, <span id="userName">...</span></span>
      </div>
    </div>

    <div class="post-form">
      <h3>Post or Update Your Availability</h3>
      <p>Tell quest posters what you can do. You can edit or delete your post anytime.</p>
      <div id="workerMessage" class="message"></div>
      <div class="form-group">
        <input type="text" id="workerTitle" placeholder="Title (e.g. Full Stack Developer, Logo Designer)">
      </div>
      <div class="form-group">
        <textarea id="workerDescription" placeholder="Describe your skills and experience..."></textarea>
      </div>
      <div class="form-group">
        <input type="text" id="workerTags" placeholder="Tags (e.g. #coding, #art, #writing)">
      </div>
      <div style="display:flex;gap:16px;flex-wrap:wrap">
        <div class="form-group" style="flex:1;min-width:150px">
          <select id="preferredPayment">
            <option value="any">Any Payment Type</option>
            <option value="coins">Fairy Coins Only</option>
            <option value="upi">UPI Only</option>
            <option value="free">Free/Gift Only</option>
          </select>
        </div>
        <div class="form-group" style="flex:1;min-width:150px">
          <input type="number" id="minReward" placeholder="Min Reward (optional)">
        </div>
      </div>
      <button id="submitWorkerPostBtn" class="btn btn-primary" onclick="handleSubmitWorkerPost()">Post Availability</button>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
      <input type="text" id="workerSearchInput" placeholder="Search by name, skill, or tag..." style="flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;color:var(--text);font-size:0.85rem;" oninput="filterWorkerPosts()">
      <select id="workerPaymentFilter" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;color:var(--text);font-size:0.85rem;" onchange="filterWorkerPosts()">
        <option value="all">All Payment Types</option>
        <option value="coins">🪙 Fairy Coins</option>
        <option value="upi">₹ UPI</option>
        <option value="free">🎁 Free</option>
        <option value="any">Any</option>
      </select>
    </div>

    <div id="workerGrid" class="grid"></div>
  </div>

</body>
</html>
